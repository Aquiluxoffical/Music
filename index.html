<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    <title>Streamify</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] }, 
                    colors: { brand: { bg: '#050505', surface: '#0f0f0f', elevated: '#1a1a1a' } },
                    animation: {
                        'pan-bg': 'panBg 30s ease-in-out infinite alternate',
                        'float-art': 'floatArt 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        panBg: { '0%': { transform: 'scale(1.2) translate(0, 0)' }, '100%': { transform: 'scale(1.4) translate(-5%, 5%)' } },
                        floatArt: { '0%, 100%': { transform: 'translateY(0) scale(1)' }, '50%': { transform: 'translateY(-12px) scale(1.02)' } },
                        pulseGlow: { '0%, 100%': { opacity: 1 }, '50%': { opacity: 0.5 } }
                    }
                } 
            } 
        }
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -ms-overflow-style: none; scrollbar-width: none; }
        input[type="text"] { -webkit-user-select: auto; user-select: auto; }
        body { background-color: #050505; color: #ffffff; overscroll-behavior-y: none; height: 100dvh; width: 100vw; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }
        
        .pt-safe { padding-top: max(0.75rem, env(safe-area-inset-top)); }
        .pb-safe { padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
        
        /* Dynamic clearance for Mobile Nav (72px) + Mini Player (68px) + Safe Area */
        .pb-list-clearance { padding-bottom: calc(155px + env(safe-area-inset-bottom)); }
        @media (min-width: 768px) {
            .pb-list-clearance { padding-bottom: 110px; }
        }
        
        /* Stacked Mobile Mini Player Position above Bottom Nav */
        .mini-player-pos { bottom: calc(74px + env(safe-area-inset-bottom)); }
        @media (min-width: 768px) {
            .mini-player-pos { bottom: 24px; }
        }

        /* Ultra-premium glass */
        .glass { background: rgba(15, 15, 15, 0.72); backdrop-filter: blur(40px) saturate(160%); -webkit-backdrop-filter: blur(40px) saturate(160%); border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(22, 22, 24, 0.78); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.12); }
        .glass-btn { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Range Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 24px; display: flex; align-items: center; }
        input[type=range]:focus { outline: none; }
        .progress-track { background: rgba(255,255,255,0.15); height: 4px; border-radius: 2px; width: 100%; position: relative; overflow: hidden; }
        .progress-fill { background: #ffffff; height: 100%; width: 0%; border-radius: 2px; position: absolute; top: 0; left: 0; pointer-events: none; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 0px; width: 0px; }
        
        .slide-up { transform: translateY(0%); opacity: 1; }
        .slide-down { transform: translateY(120%); opacity: 0; }
        
        .lyrics-mask { mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); }
    </style>
</head>
<body class="flex flex-col md:flex-row select-none">

    <!-- Native Audio Carrier Bridge for iOS Control Center -->
    <audio id="bgAudioCarrier" loop playsinline preload="auto"></audio>

    <!-- Strictly Off-screen YouTube Player -->
    <div style="position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; z-index: -9999;">
        <div id="ytplayer"></div>
    </div>

    <!-- Desktop / iPad Landscape Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-brand-surface h-full z-10 p-4 border-r border-white/10 shrink-0">
        <div class="text-xl font-extrabold text-white mb-8 px-4 mt-2 tracking-[0.2em] uppercase">
            Streamify
        </div>
        <nav class="flex flex-col gap-2">
            <button id="deskNavHome" class="flex items-center gap-4 text-white font-semibold p-4 rounded-xl bg-white/10 transition text-left" onclick="switchTab('home')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3l10 9h-3v9H5v-9H2z"/></svg> Home
            </button>
            <button id="deskNavSearch" class="flex items-center gap-4 text-white/60 font-semibold p-4 rounded-xl hover:text-white transition text-left" onclick="switchTab('search')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.42 1.42-4.39-4.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg> Search
            </button>
            <button id="deskNavLibrary" class="flex items-center gap-4 text-white/60 font-semibold p-4 rounded-xl hover:text-white transition text-left" onclick="switchTab('library')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg> Library
            </button>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-brand-bg relative z-0 items-center w-full overflow-hidden">
        
        <!-- Centered Header + Integrated Search -->
        <header class="px-4 pt-safe pb-3 md:p-6 sticky top-0 bg-brand-bg/85 backdrop-blur-3xl z-10 flex flex-col gap-3 border-b border-white/5 w-full max-w-5xl">
            <div class="w-full flex items-center justify-center relative py-1">
                <span class="text-xs md:text-sm font-extrabold text-white tracking-[0.28em] uppercase">Streamify</span>
            </div>
            <form id="searchForm" class="relative w-full max-w-xl mx-auto">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white/40"><path d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.42 1.42-4.39-4.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
                <input type="text" id="searchInput" placeholder="Search artists, songs, lyrics..." class="w-full bg-white/5 border border-white/10 text-white rounded-full py-2.5 pl-11 pr-4 font-medium focus:outline-none focus:bg-white/10 focus:border-white/25 transition-all shadow-inner placeholder-white/30 text-sm">
            </form>
        </header>

        <!-- Scrollable Track Grid with Proper Bottom Clearance -->
        <div class="flex-1 overflow-y-auto px-4 md:px-6 pb-list-clearance w-full max-w-5xl" id="mainScrollArea">
            <div id="loadingState" class="hidden flex-col items-center justify-center py-32 text-white/50">
                <div class="w-10 h-10 border-2 border-white/10 border-t-white rounded-full animate-spin mb-4"></div>
                <p class="tracking-widest text-xs uppercase font-semibold text-white/40">Curating</p>
            </div>
            <div id="resultsState" class="mt-4 hidden">
                <h2 class="text-xl md:text-2xl font-extrabold mb-5 tracking-tighter pl-1" id="resultsTitle">Discover</h2>
                <div class="flex flex-col gap-2.5 sm:grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 sm:gap-4" id="songsList"></div>
            </div>
        </div>
    </main>

    <!-- Stacked Mini Player (Positioned cleanly ABOVE Bottom Nav on Mobile) -->
    <div class="fixed mini-player-pos left-0 w-full z-30 flex justify-center pointer-events-none px-3 md:pl-64 transition-all duration-300">
        <div id="miniPlayer" class="glass-card w-full max-w-md h-[62px] flex items-center justify-between px-3 cursor-pointer hidden rounded-2xl shadow-[0_15px_35px_rgba(0,0,0,0.85)] slide-down transition-all duration-500 overflow-hidden pointer-events-auto" onclick="openFullScreenPlayer()">
            <div class="absolute bottom-0 left-0 w-full h-[2px] bg-white/5 overflow-hidden">
                <div id="miniProgress" class="h-full bg-white w-0 shadow-[0_0_10px_white]"></div>
            </div>
            <div class="flex items-center gap-3 w-3/4 min-w-0">
                <img id="miniArt" src="" class="w-10 h-10 rounded-xl shadow-lg object-cover bg-white/10 border border-white/10 shrink-0">
                <div class="flex flex-col overflow-hidden w-full justify-center">
                    <span id="miniTitle" class="text-white text-sm font-bold truncate tracking-tight"></span>
                    <span id="miniArtist" class="text-white/50 text-[10px] font-semibold truncate uppercase tracking-wider mt-0.5"></span>
                </div>
            </div>
            <div class="flex items-center justify-end gap-1 shrink-0">
                <button class="text-white w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition active:scale-90" onclick="togglePlay(event)" id="miniPlayBtn">
                    <svg id="miniPlayIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="miniPauseIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <div id="miniBufferingIcon" class="hidden w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Navigation (Always Accessible, Never Covered) -->
    <nav class="md:hidden glass fixed bottom-0 left-0 w-full z-40 flex items-center justify-around pb-safe pt-2 px-2">
        <button id="mobNavHome" class="flex flex-col items-center gap-1 text-white p-1.5 w-20 transition" onclick="switchTab('home')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 3l10 9h-3v9H5v-9H2z"/></svg>
            <span class="text-[10px] font-semibold tracking-wide">Home</span>
        </button>
        <button id="mobNavSearch" class="flex flex-col items-center gap-1 text-white/50 hover:text-white p-1.5 w-20 transition" onclick="switchTab('search')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.42 1.42-4.39-4.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
            <span class="text-[10px] font-semibold tracking-wide">Search</span>
        </button>
        <button id="mobNavLibrary" class="flex flex-col items-center gap-1 text-white/50 hover:text-white p-1.5 w-20 transition" onclick="switchTab('library')">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
            <span class="text-[10px] font-semibold tracking-wide">Library</span>
        </button>
    </nav>

    <!-- Full Screen Player Overlay -->
    <div id="fullPlayer" class="fixed inset-0 z-50 bg-black flex flex-col slide-down transition-all duration-500 pt-safe pb-safe h-[100dvh] overflow-hidden">
        
        <div class="absolute inset-0 z-[-2] overflow-hidden bg-black">
            <img id="fullBgArt" src="" class="w-full h-full object-cover blur-[60px] opacity-40 animate-pan-bg scale-150 transform-gpu">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-transparent"></div>
            <div class="absolute inset-0 bg-black/30 backdrop-saturate-200"></div>
        </div>

        <!-- Header Navigation -->
        <div class="flex items-center justify-between px-6 py-4 z-10 relative w-full">
            <div class="flex-1 flex justify-start z-20">
                <button class="w-10 h-10 flex items-center justify-start text-white/60 hover:text-white transition rounded-full" onclick="closeFullScreenPlayer()">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" class="-ml-2"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </button>
            </div>
            
            <div class="absolute inset-x-0 flex justify-center pointer-events-none z-10">
                <span class="text-[10px] font-extrabold text-white/50 tracking-[0.3em] uppercase">Streamify</span>
            </div>

            <div class="flex-1 flex justify-end z-20">
                <button id="lyricsBtn" class="w-10 h-10 flex items-center justify-center text-white/60 hover:text-white transition rounded-full" onclick="toggleLyrics()">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                </button>
            </div>
        </div>

        <!-- Visual Area -->
        <div class="flex-1 relative flex items-center justify-center w-full mt-2 mb-4 min-h-0">
            <div id="fullArtContainer" class="w-full flex items-center justify-center px-8 transition-all duration-700 ease-in-out transform-gpu">
                <div class="relative w-full max-w-[320px] md:max-w-[400px] aspect-square group rounded-3xl shadow-[0_30px_60px_rgba(0,0,0,0.8)] border border-white/10 bg-white/5 p-2">
                    <img id="fullArt" src="" class="w-full h-full object-cover rounded-2xl transition-opacity duration-500">
                    <div id="playingGlow" class="absolute inset-0 bg-white/5 rounded-2xl opacity-0 pointer-events-none transition-opacity duration-500"></div>
                </div>
            </div>

            <!-- Synced / Plain Lyrics View -->
            <div id="lyricsContainer" class="absolute inset-0 flex flex-col px-6 md:px-16 overflow-hidden lyrics-mask opacity-0 scale-95 pointer-events-none transition-all duration-700 ease-in-out z-10">
                <div class="flex-1 overflow-y-auto pb-20 pt-10" id="lyricsScrollArea">
                    <div class="flex flex-col justify-start space-y-5 text-left min-h-full max-w-xl mx-auto" id="mockLyrics"></div>
                </div>
            </div>
        </div>

        <!-- Controls Area -->
        <div class="flex-shrink-0 flex flex-col w-full md:max-w-[500px] md:mx-auto pb-6 z-10">
            <div class="px-8 flex flex-col pt-4 pb-2">
                
                <div class="flex items-center justify-between mb-6">
                    <div class="flex flex-col min-w-0 pr-4">
                        <h2 id="fullTitle" class="text-2xl md:text-3xl font-extrabold text-white truncate tracking-tighter drop-shadow-lg"></h2>
                        <h3 id="fullArtist" class="text-xs md:text-sm font-semibold text-white/50 truncate mt-1 tracking-widest uppercase"></h3>
                    </div>
                    <button class="text-white hover:scale-110 transition-transform active:scale-90 flex-shrink-0 drop-shadow-lg" onclick="toggleLibrary()">
                        <svg id="libraryIcon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    </button>
                </div>

                <!-- Progress Bar -->
                <div class="flex flex-col mb-6 group">
                    <div class="relative w-full h-6 flex items-center">
                        <input type="range" min="0" max="100" value="0" step="0.1" class="absolute w-full h-full z-10 opacity-0 cursor-pointer touch-none" id="progressBar">
                        <div class="progress-track"><div class="progress-fill" id="progressFillMain"></div></div>
                    </div>
                    <div class="flex justify-between text-[10px] font-bold text-white/40 mt-2 font-mono tracking-widest">
                        <span id="currentTimeDisplay">0:00</span>
                        <span id="durationDisplay">0:00</span>
                    </div>
                </div>

                <!-- Playback Buttons -->
                <div class="flex items-center justify-between">
                    <button class="text-white/40 hover:text-white p-2 transition-colors" id="shuffleBtn" onclick="toggleShuffle()">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
                    </button>
                    
                    <div class="flex items-center gap-6 md:gap-8">
                        <button class="text-white p-2 hover:text-white/70 transition-colors active:scale-90" onclick="playPrevious()">
                            <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        
                        <button class="w-[72px] h-[72px] bg-white rounded-full flex items-center justify-center text-black shadow-[0_0_30px_rgba(255,255,255,0.3)] hover:scale-105 active:scale-95 transition-all relative" onclick="togglePlay(event)">
                            <svg id="fullPlayIcon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" class="ml-1"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="fullPauseIcon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                            <div id="fullBufferingIcon" class="hidden absolute w-[76px] h-[76px] border-[3px] border-black/10 border-t-black rounded-full animate-spin"></div>
                        </button>
                        
                        <button class="text-white p-2 hover:text-white/70 transition-colors active:scale-90" onclick="playNext()">
                            <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>

                    <button class="text-white/40 hover:text-white p-2 transition-colors relative" id="loopBtn" onclick="toggleLoop()">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                        <span id="loopOneBadge" class="hidden absolute top-0 right-0 bg-white text-black text-[8px] font-extrabold rounded-full w-4 h-4 flex items-center justify-center">1</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-safe mt-4 left-1/2 transform -translate-x-1/2 z-[100] glass-btn rounded-full px-6 py-3 text-xs font-bold text-white uppercase tracking-widest flex items-center gap-2 opacity-0 pointer-events-none -translate-y-4 transition-all duration-300 shadow-2xl whitespace-nowrap">
        <span id="toast-message">Notification</span>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const API_KEY = 'AIzaSyA1NzhaIxHuCo_M-YYjK6c5Y0FhCj-2QMs';
        let player;
        let isPlayerReady = false;
        let currentQueue = [];
        let currentIndex = -1;
        let isPlaying = false;
        let isBuffering = false;
        let isScrubbing = false;
        let isShuffle = false;
        let loopState = 0;
        let syncInterval;
        let isLyricsMode = false;
        let myLibrary = JSON.parse(localStorage.getItem('ytLibrary')) || [];
        const bgCarrier = document.getElementById('bgAudioCarrier');

        // Generate a valid 1-second low-level PCM WAV Blob so iOS treats it as an active media session
        function initAudioCarrier() {
            const sampleRate = 8000;
            const numSamples = sampleRate;
            const buffer = new ArrayBuffer(44 + numSamples);
            const view = new DataView(buffer);
            const writeString = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + numSamples, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate, true);
            view.setUint16(32, 1, true);
            view.setUint16(34, 8, true);
            writeString(36, 'data');
            view.setUint32(40, numSamples, true);
            
            for (let i = 0; i < numSamples; i++) {
                view.setUint8(44 + i, 128 + (i % 2 === 0 ? 1 : -1));
            }
            
            const blob = new Blob([buffer], { type: 'audio/wav' });
            bgCarrier.src = URL.createObjectURL(blob);
            bgCarrier.volume = 0.02;

            // CRITICAL BRIDGE: Sync native <audio> events directly with YouTube Player
            // When iOS Control Center hits Play/Pause, it triggers bgCarrier, which forces YouTube to respond
            bgCarrier.addEventListener('play', () => {
                if (isPlayerReady && player && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                    player.playVideo();
                }
            });
            bgCarrier.addEventListener('pause', () => {
                if (isPlayerReady && player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                }
            });
        }
        initAudioCarrier();

        function forceAudioUnlock() {
            if (bgCarrier && bgCarrier.paused) { 
                bgCarrier.play().catch(() => {}); 
            }
        }
        document.addEventListener('touchstart', forceAudioUnlock, { passive: true });
        document.addEventListener('click', forceAudioUnlock, { passive: true });

        // Navigation Tab Manager
        function switchTab(tab) {
            const tabs = ['home', 'search', 'library'];
            tabs.forEach(t => {
                const mob = document.getElementById('mobNav' + t.charAt(0).toUpperCase() + t.slice(1));
                const desk = document.getElementById('deskNav' + t.charAt(0).toUpperCase() + t.slice(1));
                if (t === tab) {
                    if (mob) { mob.classList.remove('text-white/50'); mob.classList.add('text-white'); }
                    if (desk) { desk.classList.remove('text-white/60'); desk.classList.add('text-white', 'bg-white/10'); }
                } else {
                    if (mob) { mob.classList.add('text-white/50'); mob.classList.remove('text-white'); }
                    if (desk) { desk.classList.add('text-white/60'); desk.classList.remove('text-white', 'bg-white/10'); }
                }
            });

            if (tab === 'home') {
                fetchTrending();
            } else if (tab === 'search') {
                const input = document.getElementById('searchInput');
                input.focus();
            } else if (tab === 'library') {
                showLibrary();
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'playsinline': 1, 'rel': 0, 'iv_load_policy': 3, 'origin': window.location.origin },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange, 'onError': onPlayerError }
            });
        }

        function onPlayerReady() { isPlayerReady = true; fetchTrending(); }
        function onPlayerError() { showToast("Track unavailable. Skipping..."); playNext(); }

        async function fetchTrending() {
            showLoading(true);
            try {
                const q = encodeURIComponent("latest trending dark pop hip hop visualizer official");
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&videoCategoryId=10&maxResults=20&key=${API_KEY}`);
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);
                const tracks = data.items.map(item => ({
                    id: item.id.videoId,
                    title: decodeHTMLEntities(item.snippet.title).replace(/(\(Official.*?\)|\[Official.*?\])/gi, '').trim(),
                    artist: item.snippet.channelTitle.replace(' - Topic', '').replace('VEVO', '').trim(),
                    art: item.snippet.thumbnails.high.url
                }));
                renderSongs(tracks, 'Discover');
            } catch (err) { showToast("Network error."); }
            showLoading(false);
        }

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if(!q) return;
            document.getElementById('searchInput').blur();
            showLoading(true);
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q + ' official audio')}&type=video&videoCategoryId=10&maxResults=25&key=${API_KEY}`);
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);
                const tracks = data.items.map(item => ({
                    id: item.id.videoId,
                    title: decodeHTMLEntities(item.snippet.title).replace(/(\(Official.*?\)|\[Official.*?\])/gi, '').trim(),
                    artist: item.snippet.channelTitle.replace(' - Topic', '').replace('VEVO', '').trim(),
                    art: item.snippet.thumbnails.high.url
                }));
                renderSongs(tracks, `Results: ${q}`);
            } catch (err) { showToast("Search failed."); }
            showLoading(false);
        });

        function renderSongs(tracks, title) {
            document.getElementById('resultsTitle').textContent = title;
            const songsList = document.getElementById('songsList');
            songsList.innerHTML = '';
            if(tracks.length === 0) {
                songsList.innerHTML = '<p class="text-white/40 text-sm pl-1 py-8">No tracks saved in your library yet. Tap the heart icon while playing a track to save it here.</p>';
            }
            tracks.forEach((track, idx) => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-3.5 p-2.5 rounded-2xl hover:bg-white/5 active:bg-white/10 transition-all cursor-pointer group border border-transparent hover:border-white/5";
                div.onclick = () => { forceAudioUnlock(); currentQueue = tracks; loadTrack(idx); };
                div.innerHTML = `
                    <div class="relative w-14 h-14 shrink-0 rounded-xl overflow-hidden shadow-lg bg-white/5">
                        <img src="${track.art}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/20 group-hover:bg-black/40 transition-colors"></div>
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                    <div class="flex flex-col min-w-0 flex-1 pr-2">
                        <span class="text-white font-bold text-sm truncate">${track.title}</span>
                        <span class="text-white/40 text-[11px] font-semibold uppercase tracking-wider truncate mt-1">${track.artist}</span>
                    </div>
                `;
                songsList.appendChild(div);
            });
            document.getElementById('resultsState').classList.remove('hidden');
        }

        function loadTrack(index) {
            if(!isPlayerReady || index < 0 || index >= currentQueue.length) return;
            currentIndex = index;
            const track = currentQueue[currentIndex];
            
            document.getElementById('miniTitle').textContent = track.title;
            document.getElementById('miniArtist').textContent = track.artist;
            document.getElementById('miniArt').src = track.art;
            
            document.getElementById('fullTitle').textContent = track.title;
            document.getElementById('fullArtist').textContent = track.artist;
            
            const fullArt = document.getElementById('fullArt');
            fullArt.style.opacity = 0;
            setTimeout(() => { 
                fullArt.src = track.art; 
                document.getElementById('fullBgArt').src = track.art;
                fullArt.style.opacity = 1; 
            }, 250);

            updateLibraryUI();
            fetchRealLyrics(track.artist, track.title);
            
            const progressBar = document.getElementById('progressBar');
            progressBar.value = 0;
            document.getElementById('progressFillMain').style.width = '0%';
            document.getElementById('miniProgress').style.width = '0%';
            document.getElementById('currentTimeDisplay').textContent = "0:00";
            document.getElementById('durationDisplay').textContent = "0:00";
            
            const miniPlayer = document.getElementById('miniPlayer');
            miniPlayer.classList.remove('hidden', 'slide-down');
            miniPlayer.classList.add('slide-up');

            forceAudioUnlock();
            player.loadVideoById(track.id);
            isPlaying = false;
            isBuffering = true;
            updatePlayPauseUI();
            setupMediaSession(track);
            resetVisualizer();
        }

        async function fetchRealLyrics(artist, title) {
            const lyricsBox = document.getElementById('mockLyrics');
            lyricsBox.innerHTML = '<div class="w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-spin mx-auto mt-20"></div>';
            let cleanTitle = title.replace(/(\(.*?\)|\[.*?\])/g, '').replace(/video|audio|lyric|remix|official/gi, '').trim();
            let cleanArtist = artist.replace(/vevo|official|topic/gi, '').trim();

            try {
                const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(cleanArtist)}&track_name=${encodeURIComponent(cleanTitle)}`);
                if(!res.ok) throw new Error("Not found");
                const data = await res.json();
                if(data.plainLyrics) {
                    const lines = data.plainLyrics.split('\n').filter(l => l.trim() !== '');
                    lyricsBox.innerHTML = lines.map(line => `<p class="text-white/75 text-xl md:text-2xl font-bold tracking-tight hover:text-white transition-colors my-2 leading-relaxed">${line}</p>`).join('') + 
                    '<div class="mt-8 pt-6 border-t border-white/10 pb-8"><p class="text-[10px] uppercase tracking-widest text-white/30">Lyrics via LRCLIB</p></div>';
                } else throw new Error("No lyrics");
            } catch(e) {
                lyricsBox.innerHTML = '<div class="flex flex-col items-center justify-center mt-20 opacity-50"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><line x1="19" x2="5" y1="5" y2="19"/></svg><p class="text-white text-xs font-semibold mt-4 uppercase tracking-widest">Lyrics Unavailable</p></div>';
            }
        }

        function toggleLyrics() {
            isLyricsMode = !isLyricsMode;
            const art = document.getElementById('fullArtContainer');
            const lyrics = document.getElementById('lyricsContainer');
            const btn = document.getElementById('lyricsBtn');

            if(isLyricsMode) {
                btn.classList.add('text-white', 'bg-white/15');
                btn.classList.remove('text-white/60');
                art.classList.add('opacity-0', 'scale-90', 'blur-xl');
                lyrics.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                lyrics.classList.add('pointer-events-auto');
            } else {
                btn.classList.remove('text-white', 'bg-white/15');
                btn.classList.add('text-white/60');
                art.classList.remove('opacity-0', 'scale-90', 'blur-xl');
                lyrics.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
                lyrics.classList.remove('pointer-events-auto');
            }
        }

        function setupMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ 
                    title: track.title, 
                    artist: track.artist, 
                    album: 'Streamify',
                    artwork: [{ src: track.art, sizes: '512x512', type: 'image/jpeg' }] 
                });
                navigator.mediaSession.setActionHandler('play', () => { 
                    forceAudioUnlock(); 
                    if(player) player.playVideo(); 
                });
                navigator.mediaSession.setActionHandler('pause', () => { 
                    if(bgCarrier) bgCarrier.pause();
                    if(player) player.pauseVideo(); 
                });
                navigator.mediaSession.setActionHandler('previoustrack', playPrevious);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isPlaying && player) {
                if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                    player.playVideo();
                    forceAudioUnlock();
                }
            }
        });

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true; isBuffering = false;
                forceAudioUnlock(); updatePlayPauseUI(); startSync();
                document.getElementById('fullArtContainer').classList.add('animate-float-art');
                document.getElementById('playingGlow').classList.add('animate-pulse-glow');
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false; isBuffering = false;
                if (bgCarrier && !bgCarrier.paused) bgCarrier.pause();
                updatePlayPauseUI(); stopSync();
                resetVisualizer();
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            } else if (event.data === YT.PlayerState.BUFFERING) {
                isBuffering = true; updatePlayPauseUI();
            } else if (event.data === YT.PlayerState.ENDED) {
                if(loopState === 2) { player.seekTo(0); player.playVideo(); } else { playNext(); }
            }
        }

        function resetVisualizer() {
            document.getElementById('fullArtContainer').classList.remove('animate-float-art');
            document.getElementById('playingGlow').classList.remove('animate-pulse-glow');
        }

        function togglePlay(e) {
            if(e) e.stopPropagation();
            if(!isPlayerReady) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                if (bgCarrier) bgCarrier.pause();
            } else {
                forceAudioUnlock();
                player.playVideo();
            }
        }

        function playNext(e) {
            if(e) e.stopPropagation();
            if(currentQueue.length === 0) return;
            let nextIdx = currentIndex + 1;
            if(isShuffle) nextIdx = Math.floor(Math.random() * currentQueue.length);
            else if(nextIdx >= currentQueue.length) nextIdx = (loopState === 1) ? 0 : currentIndex;
            if(nextIdx !== currentIndex) loadTrack(nextIdx);
            else if(loopState === 0) { player.stopVideo(); if(bgCarrier) bgCarrier.pause(); isPlaying = false; updatePlayPauseUI(); resetVisualizer(); }
        }

        function playPrevious() {
            if(currentQueue.length === 0) return;
            if(player.getCurrentTime() > 3) { player.seekTo(0); return; }
            let prevIdx = currentIndex - 1;
            if(prevIdx < 0) prevIdx = currentQueue.length - 1;
            loadTrack(prevIdx);
        }

        function toggleLoop() {
            loopState = (loopState + 1) % 3;
            const btn = document.getElementById('loopBtn');
            const badge = document.getElementById('loopOneBadge');
            if(loopState === 0) { btn.classList.replace('text-white', 'text-white/40'); badge.classList.add('hidden'); } 
            else if (loopState === 1) { btn.classList.replace('text-white/40', 'text-white'); badge.classList.add('hidden'); } 
            else { badge.classList.remove('hidden'); }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffleBtn');
            if(isShuffle) btn.classList.replace('text-white/40', 'text-white');
            else btn.classList.replace('text-white', 'text-white/40');
        }

        function startSync() {
            clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if(!player || !player.getCurrentTime || isScrubbing) return;
                if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                    const curr = player.getCurrentTime();
                    const dur = player.getDuration();
                    const progressBar = document.getElementById('progressBar');
                    
                    if(dur > 0) {
                        const pct = (curr / dur) * 100;
                        progressBar.value = pct;
                        document.getElementById('progressFillMain').style.width = pct + '%';
                        document.getElementById('miniProgress').style.width = pct + '%';
                        document.getElementById('currentTimeDisplay').textContent = formatTime(curr);
                        document.getElementById('durationDisplay').textContent = formatTime(dur);

                        if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
                            navigator.mediaSession.setPositionState({ duration: dur, playbackRate: 1, position: curr });
                        }
                    }
                }
            }, 500); 
        }
        function stopSync() { clearInterval(syncInterval); }

        const progressBar = document.getElementById('progressBar');
        progressBar.addEventListener('mousedown', () => { isScrubbing = true; });
        progressBar.addEventListener('touchstart', () => { isScrubbing = true; }, {passive: true});
        progressBar.addEventListener('input', (e) => {
            document.getElementById('progressFillMain').style.width = e.target.value + '%';
            if(player && player.getDuration) document.getElementById('currentTimeDisplay').textContent = formatTime((e.target.value / 100) * player.getDuration());
        });
        const finishScrub = (e) => {
            if(!isScrubbing) return;
            isScrubbing = false;
            if(player && player.getDuration) player.seekTo((e.target.value / 100) * player.getDuration(), true);
        };
        progressBar.addEventListener('mouseup', finishScrub);
        progressBar.addEventListener('touchend', finishScrub);

        function toggleLibrary() {
            if(currentIndex < 0) return;
            const track = currentQueue[currentIndex];
            const existsIdx = myLibrary.findIndex(t => t.id === track.id);
            if(existsIdx > -1) { myLibrary.splice(existsIdx, 1); showToast("Removed from Library"); } 
            else { myLibrary.push(track); showToast("Saved to Library"); }
            localStorage.setItem('ytLibrary', JSON.stringify(myLibrary));
            updateLibraryUI();
        }

        function updateLibraryUI() {
            if(currentIndex < 0) return;
            const track = currentQueue[currentIndex];
            const isFav = myLibrary.some(t => t.id === track.id);
            const icon = document.getElementById('libraryIcon');
            if(isFav) { icon.setAttribute('fill', '#ffffff'); icon.setAttribute('stroke', '#ffffff'); } 
            else { icon.setAttribute('fill', 'none'); icon.setAttribute('stroke', 'currentColor'); }
        }

        function showLibrary() {
            renderSongs(myLibrary, 'Your Library');
        }

        function updatePlayPauseUI() {
            const arr = [
                { play: document.getElementById('miniPlayIcon'), pause: document.getElementById('miniPauseIcon'), buff: document.getElementById('miniBufferingIcon') },
                { play: document.getElementById('fullPlayIcon'), pause: document.getElementById('fullPauseIcon'), buff: document.getElementById('fullBufferingIcon') }
            ];
            arr.forEach(ui => {
                if (isBuffering) { ui.play.classList.add('hidden'); ui.pause.classList.add('hidden'); ui.buff.classList.remove('hidden'); } 
                else if (isPlaying) { ui.play.classList.add('hidden'); ui.pause.classList.remove('hidden'); ui.buff.classList.add('hidden'); } 
                else { ui.play.classList.remove('hidden'); ui.pause.classList.add('hidden'); ui.buff.classList.add('hidden'); }
            });
        }

        function openFullScreenPlayer() { const fp = document.getElementById('fullPlayer'); fp.classList.remove('slide-down'); fp.classList.add('slide-up'); }
        function closeFullScreenPlayer() { const fp = document.getElementById('fullPlayer'); fp.classList.remove('slide-up'); fp.classList.add('slide-down'); }
        function formatTime(s) { if(isNaN(s)) return "0:00"; const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
        function decodeHTMLEntities(text) { const t = document.createElement("textarea"); t.innerHTML = text; return t.value; }
        function showLoading(show) {
            const ls = document.getElementById('loadingState'), rs = document.getElementById('resultsState');
            if(show) { ls.classList.remove('hidden'); ls.classList.add('flex'); rs.classList.add('hidden'); } 
            else { ls.classList.add('hidden'); ls.classList.remove('flex'); }
        }
        
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast-container');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('opacity-0', '-translate-y-4'); toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('opacity-100', 'translate-y-0'); toast.classList.add('opacity-0', '-translate-y-4'); }, 3000);
        }
    </script>
</body>
</html>

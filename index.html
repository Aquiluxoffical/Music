<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <title>Streamify - Hybrid Audio Engine</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Official YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        app: {
                            bg: '#000000', surface: '#121212', elevated: '#181818',
                            highlight: '#282828', accent: '#1DB954', text: '#ffffff', muted: '#b3b3b3'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #000; color: #fff; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass { background: rgba(24, 24, 24, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-panel { background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        /* Custom Sliders */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 24px; display: flex; align-items: center; }
        input[type=range]:focus { outline: none; }
        .progress-track { background: linear-gradient(to right, #1DB954 0%, #1DB954 0%, #4d4d4d 0%, #4d4d4d 100%); height: 4px; border-radius: 2px; width: 100%; position: relative; transition: height 0.2s; pointer-events: none;}
        .slider-container:hover .progress-track { height: 6px; }
        
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 0px; width: 0px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: height 0.2s, width 0.2s; }
        .slider-container:hover input[type=range]::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { height: 12px; width: 12px; margin-top: -3px; }

        /* Animations */
        .player-visible { transform: translateY(0%); }
        .player-hidden { transform: translateY(100%); }
        
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .active-nav { color: #fff; font-weight: 700; }
    </style>
</head>
<body class="flex h-[100dvh] w-full overflow-hidden select-none pb-[70px] md:pb-0 relative">

    <!-- Hidden YouTube Player Div -->
    <div id="youtube-player" class="absolute w-0 h-0 opacity-0 pointer-events-none -left-[9999px]"></div>

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-app-bg h-full z-10 p-6 pt-safe border-r border-white/5 shrink-0">
        <div class="text-2xl font-bold text-white mb-8 flex items-center gap-3">
            <i class="fa-brands fa-spotify text-app-accent text-3xl"></i> Streamify
        </div>
        <nav class="flex flex-col gap-4 font-semibold text-sm">
            <a href="#" class="flex items-center gap-4 text-app-muted hover:text-white transition nav-link active-nav" data-target="homeView">
                <i class="fa-solid fa-house text-xl w-6"></i> Home
            </a>
            <a href="#" class="flex items-center gap-4 text-app-muted hover:text-white transition nav-link" data-target="searchView">
                <i class="fa-solid fa-magnifying-glass text-xl w-6"></i> Search
            </a>
            <a href="#" class="flex items-center gap-4 text-app-muted hover:text-white transition nav-link" data-target="libraryView">
                <i class="fa-solid fa-book text-xl w-6"></i> Your Library
            </a>
        </nav>
        <div class="mt-8 pt-6 border-t border-app-highlight">
            <a href="#" class="flex items-center gap-4 text-app-muted hover:text-white transition text-sm font-semibold nav-link" data-target="libraryView">
                <div class="w-6 h-6 bg-gradient-to-br from-indigo-600 to-blue-300 rounded-sm flex items-center justify-center text-white">
                    <i class="fa-solid fa-heart text-xs"></i>
                </div>
                Liked Songs
            </a>
        </div>
        <div class="mt-auto pt-4 text-xs text-app-muted flex items-center gap-2">
            <i class="fa-brands fa-youtube text-red-500"></i> YouTube Audio Engine
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-app-surface relative z-0 md:rounded-lg md:my-2 md:mr-2 overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-app-highlight to-app-surface opacity-50 z-0 pointer-events-none"></div>

        <div class="flex-1 overflow-y-auto z-10 pb-32 pt-safe px-4 md:px-8" id="mainScrollArea">
            
            <!-- Home View -->
            <div id="homeView" class="view-section pt-6">
                <h1 class="text-3xl font-bold mb-6 text-white">Discover</h1>
                <div id="homeLoading" class="flex flex-col items-center justify-center py-20 opacity-70">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-app-accent mb-4"></i>
                    <p>Loading iTunes Metadata...</p>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 hidden" id="homeGrid"></div>
            </div>

            <!-- Search View -->
            <div id="searchView" class="view-section hidden pt-6">
                <form id="searchForm" class="relative mb-8 max-w-2xl mx-auto">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-800 text-lg"></i>
                    <input type="text" id="searchInput" placeholder="Search artists, songs..." 
                        class="w-full bg-white text-black rounded-full py-3.5 pl-12 pr-12 font-medium focus:outline-none focus:ring-2 focus:ring-app-accent transition shadow-md">
                    <button type="button" id="clearSearch" class="hidden absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-800 p-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </form>

                <div id="searchLoading" class="hidden flex-col items-center justify-center py-20 opacity-70">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-app-accent mb-4"></i>
                </div>

                <div id="searchResults" class="hidden">
                    <h2 class="text-xl font-bold mb-4">Top Results</h2>
                    <div class="flex flex-col gap-2" id="searchList"></div>
                </div>
            </div>

            <!-- Library View -->
            <div id="libraryView" class="view-section hidden pt-6">
                <div class="flex items-center gap-6 mb-8">
                    <div class="w-24 h-24 bg-gradient-to-br from-indigo-600 to-blue-300 rounded-lg flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-heart text-4xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold mb-2">Liked Songs</h1>
                        <p class="text-app-muted text-sm"><span id="likedCount">0</span> songs</p>
                    </div>
                </div>
                <button class="w-12 h-12 bg-app-accent rounded-full flex items-center justify-center text-black shadow-xl hover:scale-105 transition-transform mb-6" onclick="playLibrary()">
                    <i class="fa-solid fa-play ml-1 text-xl"></i>
                </button>
                <div class="flex flex-col gap-2" id="libraryList">
                    <div class="py-10 text-center text-app-muted">No liked songs yet.</div>
                </div>
            </div>

        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden glass fixed bottom-0 left-0 w-full h-[70px] z-20 flex items-center justify-around pb-safe">
        <a href="#" class="flex flex-col items-center gap-1 text-app-text p-2 nav-link active-nav" data-target="homeView">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-app-muted hover:text-white p-2 nav-link" data-target="searchView">
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
            <span class="text-[10px] font-medium">Search</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-app-muted hover:text-white p-2 nav-link" data-target="libraryView">
            <i class="fa-solid fa-book text-xl"></i>
            <span class="text-[10px] font-medium">Library</span>
        </a>
    </nav>

    <!-- Mini Player -->
    <div id="miniPlayer" class="glass fixed bottom-[70px] md:bottom-2 left-2 right-2 md:left-[270px] rounded-md h-[60px] z-30 flex items-center justify-between px-3 cursor-pointer hidden shadow-2xl transition-transform duration-300 translate-y-[150%] md:h-[72px] md:rounded-lg">
        <div class="flex items-center gap-3 w-2/3 min-w-0" onclick="openFullScreenPlayer()">
            <img id="miniArt" src="" alt="Art" class="w-10 h-10 md:w-12 md:h-12 rounded object-cover bg-app-elevated shrink-0 shadow">
            <div class="flex flex-col overflow-hidden w-full pr-2">
                <span id="miniTitle" class="text-white text-sm font-medium line-clamp-1">Title</span>
                <span id="miniArtist" class="text-app-muted text-xs line-clamp-1">Artist</span>
            </div>
        </div>
        
        <div class="flex items-center justify-end gap-2 md:gap-4 shrink-0">
            <button class="text-app-muted hover:text-white p-2" id="miniLikeBtn" onclick="toggleCurrentFavorite(event)">
                <i class="fa-regular fa-heart text-lg md:text-xl"></i>
            </button>
            <button class="text-app-text w-10 h-10 flex items-center justify-center hover:scale-105 active:scale-95 transition relative" onclick="togglePlay(event)">
                <i class="fa-solid fa-play text-xl md:text-2xl absolute" id="miniPlayIcon"></i>
                <i class="fa-solid fa-circle-notch fa-spin text-xl md:text-2xl absolute opacity-0 text-app-accent" id="miniLoaderIcon"></i>
            </button>
        </div>

        <div class="absolute bottom-0 left-2 right-2 h-[2px] bg-white/10 rounded-full overflow-hidden">
            <div id="miniProgressBar" class="h-full bg-white w-0 rounded-full transition-all duration-100"></div>
        </div>
    </div>

    <!-- Full Screen "Now Playing" -->
    <div id="fullPlayer" class="fixed inset-0 z-50 bg-app-bg flex flex-col transition-transform duration-400 player-hidden shadow-2xl">
        <!-- Blurred Background -->
        <div class="absolute inset-0 z-[-1] overflow-hidden opacity-40">
            <img id="fullBgArt" src="" class="w-full h-full object-cover blur-3xl scale-125" alt="">
            <div class="absolute inset-0 bg-black/60"></div>
        </div>

        <!-- Header -->
        <div class="flex items-center justify-between px-6 pt-safe pb-2 mt-4">
            <button class="w-10 h-10 flex items-center justify-center text-white hover:scale-110 transition" onclick="closeFullScreenPlayer()">
                <i class="fa-solid fa-chevron-down text-2xl"></i>
            </button>
            <div class="flex flex-col items-center text-xs font-bold uppercase tracking-widest text-app-muted">Now Playing</div>
            <div class="w-10"></div>
        </div>

        <!-- Tabs -->
        <div class="flex justify-center gap-6 text-sm font-semibold text-app-muted mb-4 z-10">
            <span class="cursor-pointer text-white pb-1 border-b-2 border-app-accent" id="tabPlayer" onclick="switchFullView('player')">Player</span>
            <span class="cursor-pointer pb-1 border-b-2 border-transparent hover:text-white" id="tabQueue" onclick="switchFullView('queue')">Queue</span>
        </div>

        <div class="flex-1 relative overflow-hidden flex flex-col">
            <!-- Player View -->
            <div id="fp-playerView" class="absolute inset-0 flex flex-col px-8 transition-opacity duration-300">
                <div class="relative flex-1 flex items-center justify-center max-h-[45vh] md:max-h-[55vh] w-full max-w-[400px] mx-auto group mb-4">
                    <img id="fullArt" src="" alt="Album Art" class="w-full aspect-square rounded-xl shadow-2xl object-cover transition-transform duration-500 z-10">
                </div>

                <div class="flex flex-col mt-auto w-full max-w-[500px] mx-auto pb-10">
                    <!-- Song Info -->
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex flex-col min-w-0 pr-4">
                            <h2 id="fullTitle" class="text-2xl font-bold text-white line-clamp-1 w-full">Title</h2>
                            <h3 id="fullArtist" class="text-lg text-app-muted line-clamp-1 w-full mt-1">Artist</h3>
                        </div>
                        <button class="text-app-muted hover:text-white text-3xl transition-transform active:scale-75" id="fullLikeBtn" onclick="toggleCurrentFavorite(event)">
                            <i class="fa-regular fa-heart"></i>
                        </button>
                    </div>

                    <!-- Progress -->
                    <div class="flex flex-col mb-8">
                        <div class="relative w-full h-6 flex items-center cursor-pointer slider-container">
                            <input type="range" min="0" max="100" value="0" class="absolute w-full h-full z-10 opacity-0 cursor-pointer" id="progressBarInput">
                            <div class="progress-track" id="progressTrackBg"></div>
                        </div>
                        <div class="flex justify-between text-xs font-medium text-app-muted mt-1">
                            <span id="currentTimeDisplay">0:00</span>
                            <span id="durationDisplay">-:--</span>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="flex items-center justify-between">
                        <button class="text-app-muted hover:text-white text-xl p-2 transition-colors" id="shuffleBtn" onclick="toggleShuffle()">
                            <i class="fa-solid fa-shuffle"></i>
                        </button>
                        <button class="text-white text-4xl p-2 active:scale-90 transition-transform" onclick="playPrevious()">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        
                        <button class="w-[72px] h-[72px] bg-white rounded-full flex items-center justify-center text-black text-3xl shadow-xl hover:scale-105 active:scale-95 transition-transform relative" onclick="togglePlay(event)">
                            <i class="fa-solid fa-play ml-1 absolute" id="fullPlayIcon"></i>
                            <i class="fa-solid fa-circle-notch fa-spin absolute opacity-0 text-app-accent" id="fullLoaderIcon"></i>
                        </button>
                        
                        <button class="text-white text-4xl p-2 active:scale-90 transition-transform" onclick="playNext()">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button class="text-app-muted hover:text-white text-xl p-2 transition-colors" id="loopBtn" onclick="toggleLoop()">
                            <i class="fa-solid fa-repeat"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Queue View -->
            <div id="fp-queueView" class="absolute inset-0 px-6 overflow-y-auto pb-20 opacity-0 pointer-events-none transition-opacity duration-300 glass-panel rounded-t-3xl pt-6">
                <div class="max-w-[500px] mx-auto">
                    <h3 class="text-lg font-bold mb-4">Now Playing</h3>
                    <div id="queueNowPlaying" class="mb-6 bg-white/10 p-3 rounded-lg flex items-center gap-3 shadow-inner border border-white/5"></div>
                    <h3 class="text-lg font-bold mb-4">Up Next</h3>
                    <div id="queueList" class="flex flex-col gap-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // --- State ---
        let ytPlayer = null;
        let isAudioEngineReady = false;
        let queue = [];
        let currentQueueIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isLoop = false;
        let syncInterval = null;
        
        // Anti-Race Condition Lock
        let currentLoadPromiseId = 0;

        let favorites = JSON.parse(localStorage.getItem('streamify_favs')) || [];

        // UI References
        const UI = {
            title: [document.getElementById('miniTitle'), document.getElementById('fullTitle')],
            artist: [document.getElementById('miniArtist'), document.getElementById('fullArtist')],
            art: [document.getElementById('miniArt'), document.getElementById('fullArt'), document.getElementById('fullBgArt')],
            playIcon: [document.getElementById('miniPlayIcon'), document.getElementById('fullPlayIcon')],
            loaderIcon: [document.getElementById('miniLoaderIcon'), document.getElementById('fullLoaderIcon')],
            likeBtn: [document.getElementById('miniLikeBtn'), document.getElementById('fullLikeBtn')],
            progressBarInput: document.getElementById('progressBarInput'),
            progressTrackBg: document.getElementById('progressTrackBg'),
            miniProgressBar: document.getElementById('miniProgressBar'),
            currentTimeDisplay: document.getElementById('currentTimeDisplay'),
            durationDisplay: document.getElementById('durationDisplay')
        };

        // --- 1. YouTube IFrame Initialization ---
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '10', width: '10', // Minimal size, hidden by CSS
                playerVars: { 'autoplay': 1, 'controls': 0, 'playsinline': 1, 'origin': window.location.origin },
                events: {
                    'onReady': () => { isAudioEngineReady = true; },
                    'onStateChange': onPlayerStateChange,
                    'onError': (e) => { console.warn("YT Error:", e.data); playNext(); }
                }
            });
        }

        function onPlayerStateChange(event) {
            // States: -1 (unstarted), 0 (ended), 1 (playing), 2 (paused), 3 (buffering)
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                setLoadingState(false);
                updatePlayPauseUI();
                startProgressSync();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                updatePlayPauseUI();
            } else if (event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                if (isLoop) {
                    ytPlayer.seekTo(0);
                    ytPlayer.playVideo();
                } else {
                    playNext();
                }
            }
        }

        // --- 2. YouTube ID Scraper (AllOrigins Proxy) ---
        // This securely bypasses CORS and scrapes m.youtube.com for the exact official audio.
        async function fetchYouTubeVideoId(title, artist) {
            try {
                const query = encodeURIComponent(`${title} ${artist} official audio`);
                const targetUrl = `https://m.youtube.com/results?search_query=${query}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const html = data.contents;
                
                // Extract videoId from YouTube's initial JSON payload embedded in the HTML script tags
                const match = html.match(/"videoId":"([a-zA-Z0-9_-]{11})"/);
                if (match && match[1]) {
                    return match[1];
                }
            } catch (error) {
                console.error("Scraper Error:", error);
            }
            return null;
        }

        // --- 3. Playback Core (With Anti-Race Condition) ---
        async function loadTrack(index) {
            if (!isAudioEngineReady) {
                alert("Audio Engine is still initializing. Please wait a moment.");
                return;
            }
            if (index < 0 || index >= queue.length) return;
            
            currentQueueIndex = index;
            const track = queue[currentQueueIndex];

            // Setup Race Condition Lock
            currentLoadPromiseId++;
            const myLoadId = currentLoadPromiseId;

            // Update UI Instantly
            UI.title.forEach(el => el.textContent = track.title);
            UI.artist.forEach(el => el.textContent = track.artist);
            UI.art.forEach(el => el.src = track.artwork);
            syncHeartIcons(track.id);
            document.getElementById('miniPlayer').classList.remove('hidden', 'translate-y-[150%]');
            
            // Reset Progress Bar
            UI.progressBarInput.value = 0;
            updateSliderVisual(0);
            UI.miniProgressBar.style.width = '0%';
            UI.currentTimeDisplay.textContent = '0:00';
            UI.durationDisplay.textContent = '-:--';
            
            // Stop current playback & Show Loader
            if (ytPlayer.stopVideo) ytPlayer.stopVideo();
            setLoadingState(true);
            updateMediaSession(track);
            updateQueueUI(); // Highlight in queue

            // Fetch ID via Scraper
            const ytId = await fetchYouTubeVideoId(track.title, track.artist);
            
            // Race Condition Check: If user clicked another song while we were fetching, STOP.
            if (myLoadId !== currentLoadPromiseId) return;

            if (ytId) {
                ytPlayer.loadVideoById(ytId);
                // Usually loadVideoById auto-plays if playerVar autoplay=1, but let's be explicit
                ytPlayer.playVideo(); 
            } else {
                setLoadingState(false);
                console.warn("Failed to find audio for:", track.title);
                playNext(); // Skip unplayable tracks
            }
        }

        function togglePlay(e) {
            if (e) e.stopPropagation();
            if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
            
            const state = ytPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        function playNext() {
            if (queue.length === 0) return;
            let next = currentQueueIndex + 1;
            if (isShuffle) next = Math.floor(Math.random() * queue.length);
            else if (next >= queue.length) next = 0; // wrap around
            loadTrack(next);
        }

        function playPrevious() {
            if (queue.length === 0) return;
            // Restart if playing more than 3 seconds
            if (ytPlayer && ytPlayer.getCurrentTime() > 3) {
                ytPlayer.seekTo(0);
                return;
            }
            let prev = currentQueueIndex - 1;
            if (prev < 0) prev = queue.length - 1;
            loadTrack(prev);
        }

        // --- 4. Progress Syncing ---
        function startProgressSync() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if (!isPlaying || !ytPlayer || !ytPlayer.getCurrentTime) return;
                
                const cur = ytPlayer.getCurrentTime();
                const dur = ytPlayer.getDuration();
                
                if (dur > 0) {
                    const percent = (cur / dur) * 100;
                    UI.miniProgressBar.style.width = `${percent}%`;
                    
                    // Only update range slider if user is NOT dragging it
                    if (document.activeElement !== UI.progressBarInput) {
                        UI.progressBarInput.value = percent;
                        updateSliderVisual(percent);
                        UI.currentTimeDisplay.textContent = formatTime(cur);
                        UI.durationDisplay.textContent = formatTime(dur);
                    }
                }
            }, 500);
        }

        UI.progressBarInput.addEventListener('input', (e) => updateSliderVisual(e.target.value));
        UI.progressBarInput.addEventListener('change', (e) => {
            if (ytPlayer && ytPlayer.getDuration) {
                const dur = ytPlayer.getDuration();
                if (dur > 0) {
                    ytPlayer.seekTo((e.target.value / 100) * dur);
                }
            }
        });

        // --- 5. UI Helpers ---
        function updateSliderVisual(val) {
            UI.progressTrackBg.style.background = `linear-gradient(to right, #1DB954 ${val}%, #1DB954 ${val}%, #4d4d4d ${val}%, #4d4d4d 100%)`;
        }

        function updatePlayPauseUI() {
            const iconClass = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play ml-1";
            UI.playIcon.forEach(i => i.className = iconClass + " absolute");
            document.getElementById('fullArt').classList[isPlaying ? 'add' : 'remove']('scale-105');
        }

        function setLoadingState(isLoading) {
            UI.playIcon.forEach(i => i.style.opacity = isLoading ? '0' : '1');
            UI.loaderIcon.forEach(i => i.style.opacity = isLoading ? '1' : '0');
        }

        function formatTime(s) {
            if (isNaN(s)) return "0:00";
            const m = Math.floor(s / 60);
            const secs = Math.floor(s % 60);
            return `${m}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').classList.replace(isShuffle ? 'text-app-muted' : 'text-app-accent', isShuffle ? 'text-app-accent' : 'text-app-muted');
        }

        function toggleLoop() {
            isLoop = !isLoop;
            document.getElementById('loopBtn').classList.replace(isLoop ? 'text-app-muted' : 'text-app-accent', isLoop ? 'text-app-accent' : 'text-app-muted');
        }

        // --- 6. iTunes Data Fetching ---
        window.addEventListener('DOMContentLoaded', () => {
            setupNavigation();
            setupSearch();
            fetchHomeData();
            renderLibrary();
        });

        async function fetchITunes(query, limit = 25) {
            try {
                // High-quality, fast iTunes API. Guaranteed metadata.
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=${limit}`);
                const json = await res.json();
                return (json.results || []).map(t => ({
                    id: t.trackId.toString(),
                    title: t.trackName,
                    artist: t.artistName,
                    // Get high-res 600x600 artwork instead of default 100x100
                    artwork: t.artworkUrl100 ? t.artworkUrl100.replace('100x100bb', '600x600bb') : 'https://placehold.co/600x600/181818/ffffff?text=♫'
                }));
            } catch (err) { 
                console.error("iTunes Fetch Error:", err);
                return []; 
            }
        }

        async function fetchHomeData() {
            const tracks = await fetchITunes("Top Hits", 20);
            const grid = document.getElementById('homeGrid');
            const loading = document.getElementById('homeLoading');
            
            loading.classList.add('hidden');
            grid.classList.remove('hidden');
            grid.innerHTML = '';
            
            tracks.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = "bg-app-elevated p-4 rounded-xl hover:bg-app-highlight transition cursor-pointer group shadow border border-white/5";
                div.onclick = () => { queue = [...tracks]; loadTrack(index); };
                div.innerHTML = `
                    <div class="relative w-full aspect-square mb-4 shadow-lg rounded-md overflow-hidden">
                        <img src="${track.artwork}" class="w-full h-full object-cover">
                        <div class="absolute bottom-2 right-2 w-10 h-10 bg-app-accent rounded-full flex items-center justify-center text-black opacity-0 transform translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all shadow-xl">
                            <i class="fa-solid fa-play ml-1"></i>
                        </div>
                    </div>
                    <h3 class="font-bold text-white text-sm line-clamp-1">${track.title}</h3>
                    <p class="text-app-muted text-xs line-clamp-1 mt-1">${track.artist}</p>
                `;
                grid.appendChild(div);
            });
        }

        function setupSearch() {
            const form = document.getElementById('searchForm');
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearch');
            
            input.addEventListener('input', () => { clearBtn.style.display = input.value ? 'block' : 'none'; });
            clearBtn.addEventListener('click', () => { input.value = ''; clearBtn.style.display = 'none'; });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const q = input.value.trim();
                if (!q) return;
                
                input.blur();
                document.getElementById('searchResults').classList.add('hidden');
                document.getElementById('searchLoading').classList.replace('hidden', 'flex');
                
                const tracks = await fetchITunes(q, 30);
                
                document.getElementById('searchLoading').classList.replace('flex', 'hidden');
                document.getElementById('searchResults').classList.remove('hidden');
                
                const list = document.getElementById('searchList');
                list.innerHTML = '';
                tracks.forEach((track, index) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-3 p-2 rounded-lg hover:bg-white/10 transition cursor-pointer group";
                    div.onclick = () => { queue = [...tracks]; loadTrack(index); };
                    div.innerHTML = `
                        <div class="w-14 h-14 relative shrink-0">
                            <img src="${track.artwork}" class="w-full h-full object-cover rounded shadow">
                            <div class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center rounded">
                                <i class="fa-solid fa-play text-white"></i>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-white text-sm font-semibold line-clamp-1 group-hover:text-app-accent transition-colors">${track.title}</h4>
                            <p class="text-app-muted text-xs line-clamp-1">${track.artist}</p>
                        </div>
                        <button class="p-3 opacity-0 group-hover:opacity-100 transition-opacity text-app-muted hover:text-white" onclick="event.stopPropagation(); toggleFavoriteById('${track.id}', this, ${JSON.stringify(track).replace(/"/g, '&quot;')})">
                            <i class="${isFavorite(track.id) ? 'fa-solid text-app-accent' : 'fa-regular'} fa-heart text-lg"></i>
                        </button>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // --- 7. Favorites (Local Storage) ---
        function isFavorite(id) { return favorites.some(t => t.id === id); }

        function toggleCurrentFavorite(e) {
            if(e) e.stopPropagation();
            if(currentQueueIndex === -1) return;
            toggleFavoriteById(queue[currentQueueIndex].id, null, queue[currentQueueIndex]);
        }

        function toggleFavoriteById(id, btnElement, trackObj) {
            const index = favorites.findIndex(t => t.id === id);
            if (index > -1) favorites.splice(index, 1);
            else if(trackObj) favorites.push(trackObj);
            
            localStorage.setItem('streamify_favs', JSON.stringify(favorites));
            
            // Sync Current UI if modifying currently playing
            if(queue[currentQueueIndex] && queue[currentQueueIndex].id === id) syncHeartIcons(id);
            
            if(btnElement) {
                const icon = btnElement.querySelector('i');
                icon.className = isFavorite(id) ? 'fa-solid fa-heart text-app-accent text-lg' : 'fa-regular fa-heart text-lg';
            }
            renderLibrary();
        }

        function syncHeartIcons(id) {
            const c = isFavorite(id) ? "fa-solid fa-heart text-app-accent" : "fa-regular fa-heart";
            UI.likeBtn.forEach(btn => btn.innerHTML = `<i class="${c} ${btn.id==='fullLikeBtn'?'text-3xl':'text-xl'}"></i>`);
        }

        function renderLibrary() {
            document.getElementById('likedCount').textContent = favorites.length;
            const list = document.getElementById('libraryList');
            list.innerHTML = '';
            
            if(favorites.length === 0) {
                list.innerHTML = '<div class="py-10 text-center text-app-muted">No liked songs yet. Search and click the heart!</div>';
                return;
            }

            favorites.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-2 rounded-lg hover:bg-white/10 transition cursor-pointer group";
                div.onclick = () => { queue = [...favorites]; loadTrack(index); };
                div.innerHTML = `
                    <div class="w-12 h-12 relative shrink-0">
                        <img src="${track.artwork}" class="w-full h-full object-cover rounded shadow">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-white text-sm font-semibold line-clamp-1 group-hover:text-app-accent transition-colors">${track.title}</h4>
                        <p class="text-app-muted text-xs line-clamp-1">${track.artist}</p>
                    </div>
                    <button class="p-3 opacity-0 group-hover:opacity-100 transition-opacity text-app-muted hover:text-white" onclick="event.stopPropagation(); toggleFavoriteById('${track.id}', this, null)">
                        <i class="fa-solid fa-heart text-app-accent text-lg"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function playLibrary() {
            if(favorites.length > 0) { queue = [...favorites]; loadTrack(0); }
        }

        // --- 8. Navigation & Queue Views ---
        function setupNavigation() {
            const views = { homeView: document.getElementById('homeView'), searchView: document.getElementById('searchView'), libraryView: document.getElementById('libraryView') };
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = link.getAttribute('data-target');
                    document.querySelectorAll('.nav-link').forEach(l => {
                        l.classList.remove('active-nav', 'text-white');
                        l.classList.add('text-app-muted');
                    });
                    document.querySelectorAll(`[data-target="${target}"]`).forEach(l => {
                        l.classList.remove('text-app-muted');
                        l.classList.add('active-nav', 'text-white');
                    });
                    Object.values(views).forEach(v => v.classList.add('hidden'));
                    views[target].classList.remove('hidden');
                });
            });
        }

        function openFullScreenPlayer() {
            const fp = document.getElementById('fullPlayer');
            fp.classList.remove('hidden');
            void fp.offsetWidth; // Reflow
            fp.classList.replace('player-hidden', 'player-visible');
        }

        function closeFullScreenPlayer() {
            const fp = document.getElementById('fullPlayer');
            fp.classList.replace('player-visible', 'player-hidden');
            setTimeout(() => fp.classList.add('hidden'), 400);
        }

        function switchFullView(viewName) {
            ['Player', 'Queue'].forEach(n => {
                const el = document.getElementById(`tab${n}`);
                if (n.toLowerCase() === viewName) el.classList.add('text-white', 'border-app-accent');
                else el.classList.remove('text-white', 'border-app-accent');
            });
            ['playerView', 'queueView'].forEach(id => {
                const el = document.getElementById(`fp-${id}`);
                if (id === `${viewName}View`) el.classList.remove('opacity-0', 'pointer-events-none');
                else el.classList.add('opacity-0', 'pointer-events-none');
            });
        }

        function updateQueueUI() {
            if(currentQueueIndex === -1) return;
            const current = queue[currentQueueIndex];
            document.getElementById('queueNowPlaying').innerHTML = `
                <img src="${current.artwork}" class="w-12 h-12 rounded shadow">
                <div class="min-w-0 flex-1">
                    <p class="text-app-accent font-bold text-sm line-clamp-1">${current.title}</p>
                    <p class="text-app-muted text-xs line-clamp-1">${current.artist}</p>
                </div>
                <i class="fa-solid fa-volume-high text-app-accent mr-2"></i>
            `;

            const qList = document.getElementById('queueList');
            qList.innerHTML = '';
            const upNext = queue.slice(currentQueueIndex + 1, currentQueueIndex + 31);
            if(upNext.length === 0) {
                qList.innerHTML = '<p class="text-app-muted text-sm mt-4 text-center">No upcoming tracks.</p>';
                return;
            }

            upNext.forEach((track, idx) => {
                const actualIndex = currentQueueIndex + 1 + idx;
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-2 rounded-lg hover:bg-white/10 cursor-pointer transition";
                div.onclick = () => { loadTrack(actualIndex); switchFullView('player'); };
                div.innerHTML = `
                    <img src="${track.artwork}" class="w-12 h-12 rounded shadow">
                    <div class="flex flex-col flex-1 min-w-0">
                        <span class="text-white text-sm line-clamp-1">${track.title}</span>
                        <span class="text-app-muted text-xs line-clamp-1">${track.artist}</span>
                    </div>
                `;
                qList.appendChild(div);
            });
        }

        // --- 9. Media Session API (Lock Screen) ---
        function updateMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title, artist: track.artist, album: 'Streamify',
                    artwork: [{ src: track.artwork, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', () => ytPlayer && ytPlayer.playVideo());
                navigator.mediaSession.setActionHandler('pause', () => ytPlayer && ytPlayer.pauseVideo());
                navigator.mediaSession.setActionHandler('previoustrack', playPrevious);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
            }
        }
    </script>
</body>
</html>

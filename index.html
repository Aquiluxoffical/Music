<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream - Native Music App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        app: {
                            bg: '#000000',
                            surface: '#121212',
                            elevated: '#1e1e1e',
                            accent: '#FA233B', /* iOS Apple Music style pink/red accent */
                            text: '#ffffff',
                            muted: '#a3a3a3'
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1) forwards',
                        'slide-down': 'slideDown 0.4s cubic-bezier(0.32, 0.72, 0, 1) forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' },
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(0)' },
                            '100%': { transform: 'translateY(100%)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styles & Overrides */
        body {
            background-color: #000;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile apps */
        }

        /* Hide scrollbar for a cleaner native look */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Glassmorphism for mini player and bottom nav */
        .glass {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Range Slider Styling (Native feel) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 24px; /* larger touch target */
            display: flex;
            align-items: center;
        }
        
        input[type=range]:focus {
            outline: none;
        }
        
        /* The track */
        .progress-track {
            background: linear-gradient(to right, #FA233B 0%, #FA233B 0%, #333 0%, #333 100%);
            height: 4px;
            border-radius: 2px;
            width: 100%;
            position: relative;
        }

        /* The thumb */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 8px; /* hidden by default, shown on hover/active */
            width: 8px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -2px; /* Center it */
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, width 0.1s, height 0.1s;
        }

        input[type=range]:active::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            margin-top: -6px;
        }

        /* Animation Classes */
        .player-visible {
            transform: translateY(0%);
        }
        .player-hidden {
            transform: translateY(100%);
        }

        /* Truncate multi-line */
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-[100dvh] w-full overflow-hidden select-none">

    <!-- Desktop Sidebar (Hidden on Mobile) -->
    <aside class="hidden md:flex flex-col w-64 bg-app-surface h-full border-r border-gray-800 z-10 p-4">
        <div class="text-2xl font-bold text-white mb-8 px-4 mt-2 flex items-center gap-2">
            <i class="fa-solid fa-compact-disc text-app-accent"></i> Stream
        </div>
        
        <nav class="flex flex-col gap-2">
            <a href="#" class="flex items-center gap-4 text-app-text font-semibold p-4 rounded-xl bg-white/10 hover:bg-white/20 transition">
                <i class="fa-solid fa-magnifying-glass text-lg w-6"></i> Search
            </a>
            <a href="#" class="flex items-center gap-4 text-app-muted font-semibold p-4 rounded-xl hover:text-white transition">
                <i class="fa-solid fa-house text-lg w-6"></i> Home
            </a>
            <a href="#" class="flex items-center gap-4 text-app-muted font-semibold p-4 rounded-xl hover:text-white transition">
                <i class="fa-solid fa-layer-group text-lg w-6"></i> Library
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-app-bg relative z-0">
        
        <!-- Header / Search Bar -->
        <header class="p-4 pt-6 md:p-6 sticky top-0 bg-app-bg/95 backdrop-blur z-10">
            <h1 class="text-3xl font-bold mb-4 md:hidden">Search</h1>
            <form id="searchForm" class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Artists, songs, or podcasts" 
                    class="w-full bg-app-elevated text-white rounded-xl py-3 pl-12 pr-4 font-medium focus:outline-none focus:ring-2 focus:ring-white/20 transition shadow-inner">
                <!-- Clear Button -->
                <button type="button" id="clearSearch" class="hidden absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </form>
        </header>

        <!-- Content Scroll Area -->
        <div class="flex-1 overflow-y-auto px-4 md:px-6 pb-40 md:pb-28" id="mainScrollArea">
            
            <!-- Default State -->
            <div id="defaultState" class="mt-4">
                <h2 class="text-xl font-bold mb-4">Browse Categories</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <div class="bg-gradient-to-br from-purple-600 to-blue-500 rounded-xl p-4 aspect-square flex flex-col justify-end shadow-lg cursor-pointer hover:scale-105 transition-transform" onclick="triggerSearch('Pop')">
                        <span class="font-bold text-lg">Pop</span>
                    </div>
                    <div class="bg-gradient-to-br from-green-500 to-emerald-700 rounded-xl p-4 aspect-square flex flex-col justify-end shadow-lg cursor-pointer hover:scale-105 transition-transform" onclick="triggerSearch('Hip-Hop')">
                        <span class="font-bold text-lg">Hip-Hop</span>
                    </div>
                    <div class="bg-gradient-to-br from-orange-500 to-red-500 rounded-xl p-4 aspect-square flex flex-col justify-end shadow-lg cursor-pointer hover:scale-105 transition-transform" onclick="triggerSearch('Rock')">
                        <span class="font-bold text-lg">Rock</span>
                    </div>
                    <div class="bg-gradient-to-br from-indigo-800 to-purple-900 rounded-xl p-4 aspect-square flex flex-col justify-end shadow-lg cursor-pointer hover:scale-105 transition-transform" onclick="triggerSearch('Electronic')">
                        <span class="font-bold text-lg">Electronic</span>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="hidden flex-col items-center justify-center py-20 opacity-70">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-app-accent mb-4"></i>
                <p>Searching Apple Music...</p>
            </div>

            <!-- Results State -->
            <div id="resultsState" class="hidden mt-2">
                <h2 class="text-xl font-bold mb-4" id="resultsTitle">Top Results</h2>
                <!-- List view for mobile, Grid view for desktop -->
                <div class="flex flex-col gap-2 md:grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 md:gap-4" id="songsList">
                    <!-- Cards injected via JS -->
                </div>
            </div>
            
            <div id="errorState" class="hidden py-10 text-center">
                <p class="text-red-400" id="errorMessage">Error loading data.</p>
            </div>

        </div>
    </main>

    <!-- Mobile Bottom Navigation (Hidden on Desktop) -->
    <nav class="md:hidden glass fixed bottom-0 left-0 w-full h-[70px] z-20 flex items-center justify-around pb-safe px-2">
        <a href="#" class="flex flex-col items-center gap-1 text-app-muted hover:text-white p-2 w-16">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-app-text p-2 w-16">
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
            <span class="text-[10px] font-medium">Search</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-app-muted hover:text-white p-2 w-16">
            <i class="fa-solid fa-layer-group text-xl"></i>
            <span class="text-[10px] font-medium">Library</span>
        </a>
    </nav>

    <!-- Mini Player (Sits above mobile nav, or at bottom on desktop) -->
    <div id="miniPlayer" class="glass fixed bottom-[70px] md:bottom-0 left-0 w-full h-16 z-30 flex items-center justify-between px-4 cursor-pointer hidden md:w-[calc(100%-16rem)] md:left-64 shadow-2xl transition-transform duration-300 translate-y-full">
        <!-- Progress Bar (Absolute Top) -->
        <div class="absolute top-0 left-0 w-full h-[2px] bg-white/10">
            <div id="miniProgressBar" class="h-full bg-app-accent w-0 transition-all duration-100"></div>
        </div>

        <div class="flex items-center gap-3 w-2/3 md:w-1/2 min-w-0" onclick="openFullScreenPlayer()">
            <img id="miniArt" src="" alt="Album Art" class="w-10 h-10 rounded shadow-md object-cover bg-app-elevated">
            <div class="flex flex-col overflow-hidden w-full">
                <span id="miniTitle" class="text-white text-sm font-semibold truncate">Song Title</span>
                <span id="miniArtist" class="text-app-muted text-xs truncate">Artist Name</span>
            </div>
        </div>
        
        <div class="flex items-center justify-end gap-4 w-1/3 md:w-1/2">
            <button class="text-app-text w-10 h-10 flex items-center justify-center hover:scale-110 transition active:scale-95" onclick="togglePlay(event)" id="miniPlayBtn">
                <i class="fa-solid fa-play text-xl" id="miniPlayIcon"></i>
            </button>
            <button class="text-app-text w-10 h-10 flex items-center justify-center hover:scale-110 transition active:scale-95 hidden sm:flex" onclick="playNext(event)">
                <i class="fa-solid fa-forward-step text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Full Screen "Now Playing" Player Overlay -->
    <div id="fullPlayer" class="fixed inset-0 z-50 bg-app-bg flex flex-col transition-transform duration-500 player-hidden pt-safe pb-safe shadow-2xl">
        
        <!-- Dynamic Blurred Background -->
        <div class="absolute inset-0 z-[-1] overflow-hidden opacity-30">
            <img id="fullBgArt" src="" class="w-full h-full object-cover blur-3xl scale-110" alt="">
            <div class="absolute inset-0 bg-black/50"></div>
        </div>

        <!-- Top Header -->
        <div class="flex items-center justify-between px-6 py-4 mt-2">
            <button class="w-10 h-10 flex items-center justify-center text-white/70 hover:text-white" onclick="closeFullScreenPlayer()">
                <i class="fa-solid fa-chevron-down text-xl"></i>
            </button>
            <div class="flex flex-col items-center">
                <span class="text-xs font-bold text-white/50 tracking-widest uppercase">Now Playing</span>
            </div>
            <!-- Bluetooth/Cast Button -->
            <button class="w-10 h-10 flex items-center justify-center text-white/70 hover:text-white" onclick="openBluetoothModal()">
                <i class="fa-brands fa-bluetooth-b text-xl"></i>
            </button>
        </div>

        <!-- Album Art -->
        <div class="flex-1 flex items-center justify-center px-8 py-2 md:py-8 max-h-[50vh]">
            <img id="fullArt" src="" alt="Album Art" class="w-full max-w-[340px] aspect-square rounded-2xl shadow-2xl object-cover transition-transform duration-500 scale-95">
        </div>

        <!-- Controls Area -->
        <div class="flex flex-col px-8 pb-8 mt-auto md:max-w-[600px] md:mx-auto md:w-full">
            
            <!-- Song Info -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex flex-col min-w-0 pr-4">
                    <h2 id="fullTitle" class="text-2xl font-bold text-white truncate w-full">Song Title</h2>
                    <h3 id="fullArtist" class="text-lg text-white/70 truncate w-full mt-1">Artist Name</h3>
                </div>
                <button class="text-white/70 hover:text-white text-2xl" onclick="toggleLike(this)">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="flex flex-col mb-8">
                <div class="relative w-full h-6 flex items-center group">
                    <input type="range" min="0" max="100" value="0" class="absolute w-full h-full z-10 opacity-0 cursor-pointer touch-none" id="progressBarInput">
                    <div class="progress-track" id="progressTrackBg"></div>
                </div>
                <div class="flex justify-between text-[11px] font-medium text-white/50 mt-1 px-1">
                    <span id="currentTimeDisplay">0:00</span>
                    <span id="durationDisplay">-0:30</span>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="flex items-center justify-between mb-8">
                <!-- Shuffle -->
                <button class="text-white/50 hover:text-white text-xl p-2 transition-colors" id="shuffleBtn" onclick="toggleShuffle()">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                
                <!-- Previous -->
                <button class="text-white text-3xl p-2 active:scale-90 transition-transform" onclick="playPrevious()">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                
                <!-- Play/Pause -->
                <button class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-black text-3xl shadow-xl hover:scale-105 active:scale-95 transition-transform" onclick="togglePlay(event)" id="fullPlayBtn">
                    <i class="fa-solid fa-play ml-1" id="fullPlayIcon"></i>
                </button>
                
                <!-- Next -->
                <button class="text-white text-3xl p-2 active:scale-90 transition-transform" onclick="playNext()">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                
                <!-- Loop -->
                <button class="text-white/50 hover:text-white text-xl p-2 transition-colors" id="loopBtn" onclick="toggleLoop()">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>
            
            <!-- Volume Control (Bonus feature for Desktop mostly, but works everywhere) -->
            <div class="flex items-center gap-3 w-full max-w-[300px] mx-auto opacity-70 hover:opacity-100 transition-opacity">
                <i class="fa-solid fa-volume-low text-xs"></i>
                <div class="relative flex-1 h-4 flex items-center">
                    <input type="range" min="0" max="100" value="100" class="absolute w-full h-full z-10 opacity-0 cursor-pointer touch-none" id="volumeInput">
                    <div class="w-full h-1 bg-white/20 rounded-full overflow-hidden">
                        <div class="h-full bg-white w-full" id="volumeTrack"></div>
                    </div>
                </div>
                <i class="fa-solid fa-volume-high text-xs"></i>
            </div>

        </div>
    </div>

    <!-- Bluetooth Connection Modal Overlay -->
    <div id="btModal" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-app-surface w-full max-w-sm rounded-2xl p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="btModalContent">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-brands fa-bluetooth-b text-blue-500"></i> Connect Device
                </h3>
                <button class="text-gray-400 hover:text-white p-1" onclick="closeBluetoothModal()">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <p class="text-sm text-app-muted mb-4">Select a device to play audio.</p>
            
            <div class="flex flex-col gap-2">
                <button class="flex items-center justify-between p-3 rounded-xl bg-white/5 hover:bg-white/10 transition group" onclick="connectDevice('AirPods Pro', this)">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-headphones text-gray-400 group-hover:text-white"></i>
                        <span class="font-medium">AirPods Pro</span>
                    </div>
                    <i class="fa-solid fa-check text-blue-500 hidden connection-check"></i>
                </button>
                <button class="flex items-center justify-between p-3 rounded-xl bg-white/5 hover:bg-white/10 transition group" onclick="connectDevice('Living Room Speaker', this)">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-speaker text-gray-400 group-hover:text-white"></i>
                        <span class="font-medium">Living Room Speaker</span>
                    </div>
                    <i class="fa-solid fa-check text-blue-500 hidden connection-check"></i>
                </button>
                <button class="flex items-center justify-between p-3 rounded-xl bg-white/5 hover:bg-white/10 transition group" onclick="connectDevice('Car Audio', this)">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-car text-gray-400 group-hover:text-white"></i>
                        <span class="font-medium">Car Audio</span>
                    </div>
                    <i class="fa-solid fa-check text-blue-500 hidden connection-check"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Core App Logic -->
    <script>
        // --- State ---
        let audio = new Audio();
        let currentTracks = [];
        let currentIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let connectedDeviceName = null;

        // --- DOM Elements ---
        const searchInput = document.getElementById('searchInput');
        const searchForm = document.getElementById('searchForm');
        const clearSearchBtn = document.getElementById('clearSearch');
        
        // Views
        const defaultState = document.getElementById('defaultState');
        const loadingState = document.getElementById('loadingState');
        const resultsState = document.getElementById('resultsState');
        const songsList = document.getElementById('songsList');
        const errorState = document.getElementById('errorState');
        
        // Mini Player
        const miniPlayer = document.getElementById('miniPlayer');
        const miniProgressBar = document.getElementById('miniProgressBar');
        const miniArt = document.getElementById('miniArt');
        const miniTitle = document.getElementById('miniTitle');
        const miniArtist = document.getElementById('miniArtist');
        const miniPlayIcon = document.getElementById('miniPlayIcon');

        // Full Player
        const fullPlayer = document.getElementById('fullPlayer');
        const fullArt = document.getElementById('fullArt');
        const fullBgArt = document.getElementById('fullBgArt');
        const fullTitle = document.getElementById('fullTitle');
        const fullArtist = document.getElementById('fullArtist');
        const fullPlayIcon = document.getElementById('fullPlayIcon');
        
        // Full Player Controls
        const progressBarInput = document.getElementById('progressBarInput');
        const progressTrackBg = document.getElementById('progressTrackBg');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        const durationDisplay = document.getElementById('durationDisplay');
        const volumeInput = document.getElementById('volumeInput');
        const volumeTrack = document.getElementById('volumeTrack');
        const loopBtn = document.getElementById('loopBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');

        // Modals
        const btModal = document.getElementById('btModal');
        const btModalContent = document.getElementById('btModalContent');

        // --- Setup Audio Events ---
        
        // By default loop is false.
        audio.loop = false;

        audio.addEventListener('play', () => {
            isPlaying = true;
            updatePlayPauseIcons();
            // Add scale animation to full screen art
            fullArt.classList.remove('scale-95');
            fullArt.classList.add('scale-100');
        });

        audio.addEventListener('pause', () => {
            isPlaying = false;
            updatePlayPauseIcons();
            // Scale down full screen art when paused
            fullArt.classList.remove('scale-100');
            fullArt.classList.add('scale-95');
        });

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            
            // Update Mini Player
            miniProgressBar.style.width = `${progress}%`;
            
            // Update Full Player only if user is NOT currently dragging the slider
            if (document.activeElement !== progressBarInput) {
                progressBarInput.value = progress;
                updateSliderVisuals(progress);
                currentTimeDisplay.textContent = formatTime(audio.currentTime);
                // Countdown duration style
                const remaining = audio.duration - audio.currentTime;
                durationDisplay.textContent = `-${formatTime(remaining)}`;
            }
        });

        audio.addEventListener('ended', () => {
            // If HTML5 audio loop is true, it handles looping automatically.
            // We only need to manually play next if it's NOT looping.
            if (!audio.loop) {
                playNext();
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration && !isFinite(audio.duration)) return;
            durationDisplay.textContent = `-${formatTime(audio.duration)}`;
        });

        // --- Search Logic ---
        
        searchInput.addEventListener('input', () => {
            clearSearchBtn.style.display = searchInput.value.length > 0 ? 'block' : 'none';
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            searchInput.focus();
            showView(defaultState);
        });

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
                triggerSearch(query);
                searchInput.blur(); // dismiss mobile keyboard
            }
        });

        function triggerSearch(query) {
            searchInput.value = query;
            clearSearchBtn.style.display = 'block';
            fetchMusic(query);
        }

        async function fetchMusic(query) {
            showView(loadingState);
            try {
                // iTunes API (returns 30s previews)
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=25`);
                const data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    currentTracks = data.results.filter(t => t.previewUrl); // Ensure playable
                    renderSongs(currentTracks);
                    document.getElementById('resultsTitle').textContent = `Results for "${query}"`;
                    showView(resultsState);
                } else {
                    document.getElementById('errorMessage').textContent = "No music found.";
                    showView(errorState);
                }
            } catch (err) {
                document.getElementById('errorMessage').textContent = "Network error. Please try again.";
                showView(errorState);
            }
        }

        function renderSongs(tracks) {
            songsList.innerHTML = '';
            tracks.forEach((track, idx) => {
                // Use a slightly larger image for the list
                const artList = track.artworkUrl100.replace('100x100bb', '150x150bb');
                
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-2 rounded-xl hover:bg-white/5 transition cursor-pointer group";
                div.onclick = () => loadAndPlay(idx);
                
                div.innerHTML = `
                    <div class="relative w-14 h-14 shrink-0">
                        <img src="${artList}" class="w-full h-full rounded-md object-cover shadow-md" alt="art">
                        <div class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center rounded-md">
                            <i class="fa-solid fa-play text-white"></i>
                        </div>
                    </div>
                    <div class="flex flex-col min-w-0 flex-1 py-1">
                        <span class="text-white font-semibold text-sm line-clamp-1">${track.trackName}</span>
                        <span class="text-app-muted text-xs line-clamp-1">${track.artistName}</span>
                    </div>
                    <button class="text-app-muted hover:text-white p-2 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                        <i class="fa-solid fa-ellipsis"></i>
                    </button>
                `;
                songsList.appendChild(div);
            });
        }

        // --- Playback Logic ---

        function loadAndPlay(index) {
            if (index < 0 || index >= currentTracks.length) return;
            currentIndex = index;
            const track = currentTracks[currentIndex];

            // Setup High Res Images
            const highResArt = track.artworkUrl100.replace('100x100bb', '600x600bb');
            
            // Update Mini Player UI
            miniArt.src = track.artworkUrl100;
            miniTitle.textContent = track.trackName;
            miniArtist.textContent = track.artistName;
            
            // Update Full Player UI
            fullArt.src = highResArt;
            fullBgArt.src = highResArt;
            fullTitle.textContent = track.trackName;
            fullArtist.textContent = track.artistName;
            
            // Reset Progress
            miniProgressBar.style.width = '0%';
            progressBarInput.value = 0;
            updateSliderVisuals(0);
            currentTimeDisplay.textContent = '0:00';
            durationDisplay.textContent = '-0:30'; // Previews are generally 30s

            // Show Mini Player with slide up animation
            miniPlayer.classList.remove('hidden');
            // Slight delay to ensure class is removed before transform applies
            setTimeout(() => {
                miniPlayer.classList.remove('translate-y-full');
            }, 10);

            // Load and Play Audio
            audio.src = track.previewUrl;
            audio.play().catch(e => console.log("Playback prevented:", e));
        }

        function togglePlay(event) {
            if(event) event.stopPropagation(); // Prevent opening full player when clicking play on mini player
            if (!audio.src) return;
            
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play();
            }
        }

        function playNext(event) {
            if(event) event.stopPropagation();
            if (currentTracks.length === 0) return;
            
            let nextIdx = currentIndex + 1;
            if (isShuffle) {
                nextIdx = Math.floor(Math.random() * currentTracks.length);
            } else if (nextIdx >= currentTracks.length) {
                nextIdx = 0; // Wrap to start
            }
            loadAndPlay(nextIdx);
        }

        function playPrevious() {
            if (currentTracks.length === 0) return;
            
            // If playing for more than 3s, restart song
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            
            let prevIdx = currentIndex - 1;
            if (prevIdx < 0) {
                prevIdx = currentTracks.length - 1;
            }
            loadAndPlay(prevIdx);
        }

        // --- Controls (Loop, Shuffle, Sliders) ---

        function toggleLoop() {
            audio.loop = !audio.loop;
            if (audio.loop) {
                loopBtn.classList.remove('text-white/50');
                loopBtn.classList.add('text-app-accent');
            } else {
                loopBtn.classList.remove('text-app-accent');
                loopBtn.classList.add('text-white/50');
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            if (isShuffle) {
                shuffleBtn.classList.remove('text-white/50');
                shuffleBtn.classList.add('text-app-accent');
            } else {
                shuffleBtn.classList.remove('text-app-accent');
                shuffleBtn.classList.add('text-white/50');
            }
        }

        function toggleLike(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('fa-regular')) {
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid', 'text-app-accent');
            } else {
                icon.classList.remove('fa-solid', 'text-app-accent');
                icon.classList.add('fa-regular');
            }
        }

        // Seek Bar Handling
        progressBarInput.addEventListener('input', (e) => {
            const value = e.target.value;
            updateSliderVisuals(value);
        });

        progressBarInput.addEventListener('change', (e) => {
            if (audio.duration) {
                const seekTime = (e.target.value / 100) * audio.duration;
                audio.currentTime = seekTime;
            }
        });

        function updateSliderVisuals(percent) {
            progressTrackBg.style.background = `linear-gradient(to right, #ffffff ${percent}%, #ffffff ${percent}%, rgba(255,255,255,0.2) ${percent}%, rgba(255,255,255,0.2) 100%)`;
        }

        // Volume Bar Handling
        volumeInput.addEventListener('input', (e) => {
            const vol = e.target.value / 100;
            audio.volume = vol;
            volumeTrack.style.width = `${e.target.value}%`;
        });

        // --- UI Updaters & Helpers ---

        function updatePlayPauseIcons() {
            const pClass = isPlaying ? "fa-pause" : "fa-play";
            // Update Mini Player
            miniPlayIcon.className = `fa-solid ${pClass} text-xl`;
            if(!isPlaying) miniPlayIcon.classList.add('ml-1'); // optical centering for play icon
            else miniPlayIcon.classList.remove('ml-1');

            // Update Full Player
            fullPlayIcon.className = `fa-solid ${pClass}`;
            if(!isPlaying) fullPlayIcon.classList.add('ml-1');
            else fullPlayIcon.classList.remove('ml-1');
        }

        function showView(view) {
            [defaultState, loadingState, resultsState, errorState].forEach(el => el.classList.add('hidden'));
            view.classList.remove('hidden');
        }

        function formatTime(secs) {
            if (isNaN(secs)) return "0:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // --- Player Transitions ---

        function openFullScreenPlayer() {
            fullPlayer.classList.remove('hidden');
            // Force reflow
            void fullPlayer.offsetWidth;
            fullPlayer.classList.remove('player-hidden');
            fullPlayer.classList.add('player-visible');
        }

        function closeFullScreenPlayer() {
            fullPlayer.classList.remove('player-visible');
            fullPlayer.classList.add('player-hidden');
            // Wait for transition to end before hiding
            setTimeout(() => {
                fullPlayer.classList.add('hidden');
            }, 500); 
        }

        // --- Bluetooth / Cast Modal ---

        function openBluetoothModal() {
            btModal.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                btModal.classList.remove('opacity-0');
                btModalContent.classList.remove('scale-95');
                btModalContent.classList.add('scale-100');
            }, 10);
        }

        function closeBluetoothModal() {
            btModal.classList.add('opacity-0');
            btModalContent.classList.remove('scale-100');
            btModalContent.classList.add('scale-95');
            setTimeout(() => {
                btModal.classList.add('hidden');
            }, 300);
        }

        function connectDevice(deviceName, btnElement) {
            // Reset all checkmarks
            document.querySelectorAll('.connection-check').forEach(el => el.classList.add('hidden'));
            
            // Show checkmark on clicked
            btnElement.querySelector('.connection-check').classList.remove('hidden');
            
            connectedDeviceName = deviceName;
            
            // Simulate connection delay
            setTimeout(() => {
                closeBluetoothModal();
            }, 600);
        }

        // Initialize empty sliders visually
        updateSliderVisuals(0);

    </script>
</body>
</html>

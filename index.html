<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Luxury Liquid Player</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255, 255, 255, 0.1)',
                            200: 'rgba(255, 255, 255, 0.05)',
                        }
                    },
                    animation: {
                        'blob': 'blob 15s infinite alternate ease-in-out',
                        'spin-slow': 'spin 12s linear infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        /* Safe area padding for modern iOS/Android */
        .pt-safe { padding-top: max(20px, env(safe-area-inset-top)); }
        .pb-safe { padding-bottom: max(20px, env(safe-area-inset-bottom)); }

        /* Ultra Premium Glassmorphism */
        .luxury-glass {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Ambient background mesh */
        .mesh-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }
        
        .blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.6;
            border-radius: 50%;
        }

        /* Sleek Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        input[type=range]:focus { outline: none; }
        
        .scrubber-track {
            background: rgba(255, 255, 255, 0.15);
            height: 4px;
            border-radius: 2px;
            width: 100%;
            position: relative;
            pointer-events: none;
        }
        .scrubber-fill {
            background: #ffffff;
            height: 100%;
            width: 30%; /* Default width */
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        
        /* The slider thumb (invisible but clickable) */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: transparent;
        }

        /* Dynamic Album Glow Fake Shadow */
        .album-glow-wrapper {
            position: relative;
        }
        .album-glow {
            position: absolute;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(35px) saturate(150%);
            opacity: 0.6;
            transform: translateY(15px) scale(0.9);
            z-index: -1;
            border-radius: 2rem;
        }
    </style>
</head>
<body class="flex flex-col relative font-sans">

    <!-- Animated Mesh Background -->
    <div class="mesh-bg">
        <div class="blob w-[300px] h-[300px] bg-red-900/40 top-[-10%] left-[-10%] animate-blob"></div>
        <div class="blob w-[400px] h-[400px] bg-amber-900/30 top-[40%] right-[-20%] animate-blob" style="animation-delay: -5s;"></div>
        <div class="blob w-[350px] h-[350px] bg-rose-950/50 bottom-[-10%] left-[10%] animate-blob" style="animation-delay: -10s;"></div>
        <!-- Noise overlay for premium texture -->
        <div class="absolute inset-0 opacity-[0.03] pointer-events-none mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
    </div>

    <!-- Header Section -->
    <header class="w-full px-6 pt-safe pb-4 flex items-center justify-between z-10">
        <button class="w-10 h-10 flex items-center justify-start text-white/70 hover:text-white transition active:scale-90">
            <!-- Chevron Down SVG -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>
        <span class="text-xs font-bold tracking-[0.2em] text-white/50 uppercase">Now Playing</span>
        <button class="w-10 h-10 flex items-center justify-end text-white/70 hover:text-white transition active:scale-90">
            <!-- Menu/Queue SVG -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
        </button>
    </header>

    <!-- Album Art Section (Takes remaining vertical space flexibly) -->
    <div class="flex-1 w-full flex items-center justify-center px-8 z-10 min-h-[30vh]">
        <div class="album-glow-wrapper w-full max-w-[360px] aspect-square transition-transform duration-500" id="artContainer">
            <!-- The Glow -->
            <div class="album-glow"></div>
            <!-- The Actual Image -->
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000&auto=format&fit=crop" 
                 alt="Album Cover" 
                 class="w-full h-full object-cover rounded-[2rem] border border-white/10 shadow-2xl relative z-10">
        </div>
    </div>

    <!-- Luxury Glass Controls Section -->
    <div class="w-full px-4 pb-safe mt-6 z-10">
        <div class="luxury-glass rounded-[2.5rem] w-full p-6 pt-8 pb-8 flex flex-col gap-6">
            
            <!-- Title & Heart Row -->
            <div class="flex items-center justify-between px-2">
                <div class="flex flex-col min-w-0 pr-4">
                    <h2 class="text-2xl font-bold tracking-tight text-white truncate">Night Lights</h2>
                    <h3 class="text-base font-medium text-white/60 truncate mt-1">Jhol & The Weeknd</h3>
                </div>
                <!-- Heart Button SVG -->
                <button class="w-10 h-10 flex items-center justify-center shrink-0 active:scale-75 transition duration-300" id="heartBtn" onclick="toggleHeart()">
                    <svg id="heartIcon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </button>
            </div>

            <!-- Scrubber Row -->
            <div class="flex flex-col relative mt-2">
                <div class="relative w-full h-6 flex items-center cursor-pointer">
                    <input type="range" min="0" max="100" value="30" class="absolute w-full h-full z-10 opacity-0" id="progressInput">
                    <div class="scrubber-track">
                        <div class="scrubber-fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="flex justify-between text-[11px] font-semibold text-white/50 px-1 mt-1 font-mono tracking-wider">
                    <span>1:24</span>
                    <span>-3:12</span>
                </div>
            </div>

            <!-- Main Playback Controls -->
            <div class="flex items-center justify-between mt-2 px-1">
                <!-- Shuffle SVG -->
                <button class="text-white/50 hover:text-white transition active:scale-90 p-2">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                        <line x1="4" y1="4" x2="9" y2="9"></line>
                    </svg>
                </button>
                
                <div class="flex items-center gap-6 sm:gap-8">
                    <!-- Prev SVG -->
                    <button class="text-white hover:text-white/80 transition active:scale-75 p-2">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="19 20 9 12 19 4 19 20"></polygon>
                            <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                        </svg>
                    </button>
                    
                    <!-- Giant Play/Pause Button -->
                    <button class="w-20 h-20 bg-white text-black rounded-full flex items-center justify-center shadow-[0_10px_30px_rgba(255,255,255,0.3)] active:scale-90 transition-all duration-300 relative group" onclick="togglePlay()">
                        <!-- Play SVG (Default) -->
                        <svg id="playIcon" class="ml-1.5 w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <!-- Pause SVG (Hidden initially) -->
                        <svg id="pauseIcon" class="hidden w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>
                    
                    <!-- Next SVG -->
                    <button class="text-white hover:text-white/80 transition active:scale-75 p-2">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 4 15 12 5 20 5 4"></polygon>
                            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                        </svg>
                    </button>
                </div>

                <!-- Loop SVG -->
                <button class="text-white/50 hover:text-white transition active:scale-90 p-2">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"></polyline>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <polyline points="7 23 3 19 7 15"></polyline>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                </button>
            </div>

            <!-- Bottom Row: Audio Routing (Bluetooth/AirPlay) -->
            <div class="flex justify-center mt-2">
                <button class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 active:scale-95 transition">
                    <!-- Airplay/Device SVG -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-white/80">
                        <path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"></path>
                        <polygon points="12 15 17 21 7 21 12 15"></polygon>
                    </svg>
                    <span class="text-xs font-semibold text-white/80 tracking-wide">Bluetooth Speaker</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Interactive Logic -->
    <script>
        // Progress Bar Sync
        const progressInput = document.getElementById('progressInput');
        const progressFill = document.getElementById('progressFill');

        progressInput.addEventListener('input', (e) => {
            progressFill.style.width = e.target.value + '%';
        });

        // Play/Pause Toggle Animation
        let isPlaying = false;
        function togglePlay() {
            isPlaying = !isPlaying;
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const artContainer = document.getElementById('artContainer');
            
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                // Subtle scale up when playing
                artContainer.style.transform = 'scale(1.02)';
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                // Subtle scale down when paused
                artContainer.style.transform = 'scale(0.95)';
            }
        }

        // Heart Toggle Animation
        let isHearted = false;
        function toggleHeart() {
            isHearted = !isHearted;
            const icon = document.getElementById('heartIcon');
            if (isHearted) {
                icon.setAttribute('fill', '#ef4444'); // Red fill
                icon.setAttribute('stroke', '#ef4444');
            } else {
                icon.setAttribute('fill', 'none');
                icon.setAttribute('stroke', 'rgba(255,255,255,0.7)');
            }
        }
        
        // Init art state
        document.getElementById('artContainer').style.transform = 'scale(0.95)';
    </script>
</body>
</html>

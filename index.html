<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Streamify Premium</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        spotify: {
                            bg: '#000000',
                            surface: '#121212',
                            elevated: '#242424',
                            accent: '#1DB954',
                            text: '#ffffff',
                            muted: '#a3a3a3'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            height: 100dvh; /* Strict viewport height */
            width: 100vw;
            overflow: hidden;
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* Safe Areas for iOS Safari */
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        .pb-nav-safe { padding-bottom: max(5rem, calc(4rem + env(safe-area-inset-bottom))); }

        /* Glassmorphism Liquid UI */
        .glass {
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 24px;
            display: flex;
            align-items: center;
        }
        input[type=range]:focus { outline: none; }
        .progress-track {
            background: rgba(255,255,255,0.2);
            height: 4px;
            border-radius: 2px;
            width: 100%;
            position: relative;
        }
        .progress-fill {
            background: #ffffff;
            height: 100%;
            width: 0%;
            border-radius: 2px;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px; width: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -4px;
            opacity: 0;
            transition: opacity 0.2s, transform 0.1s;
        }
        input[type=range]:active::-webkit-slider-thumb, 
        .group:hover input[type=range]::-webkit-slider-thumb {
            opacity: 1;
        }

        /* Animations */
        .slide-up { transform: translateY(0%); }
        .slide-down { transform: translateY(100%); }
        
        #toast-container {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row select-none">

    <!-- Invisible YouTube Player -->
    <div id="yt-container" class="absolute w-1 h-1 opacity-0 pointer-events-none overflow-hidden z-[-1] top-0 left-0">
        <div id="ytplayer"></div>
    </div>

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-spotify-surface h-full z-10 p-4">
        <div class="text-2xl font-bold text-white mb-8 px-4 mt-2 flex items-center gap-2">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" class="text-spotify-accent"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zM12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            Streamify
        </div>
        <nav class="flex flex-col gap-2">
            <a href="#" class="flex items-center gap-4 text-spotify-text font-semibold p-4 rounded-xl bg-white/10 transition" onclick="document.getElementById('searchInput').focus()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.42 1.42-4.39-4.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg> Search
            </a>
            <a href="#" class="flex items-center gap-4 text-spotify-muted font-semibold p-4 rounded-xl hover:text-white transition" onclick="fetchTrending()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3l10 9h-3v9H5v-9H2z"/></svg> Home
            </a>
            <a href="#" class="flex items-center gap-4 text-spotify-muted font-semibold p-4 rounded-xl hover:text-white transition" onclick="showFavorites()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> Favorites
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-spotify-bg relative z-0">
        
        <!-- Header -->
        <header class="p-4 pt-safe md:p-6 sticky top-0 bg-spotify-bg/90 backdrop-blur-lg z-10 flex justify-center items-center">
            <form id="searchForm" class="relative w-full max-w-2xl">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"><path d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.42 1.42-4.39-4.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
                <input type="text" id="searchInput" placeholder="Search Bollywood, Punjabi, or Global hits..." 
                    class="w-full bg-spotify-elevated text-white rounded-full py-3 pl-12 pr-4 font-medium focus:outline-none focus:ring-2 focus:ring-white/20 transition shadow-inner">
            </form>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto px-4 md:px-6 pb-nav-safe" id="mainScrollArea">
            
            <!-- Loading State -->
            <div id="loadingState" class="hidden flex-col items-center justify-center py-20 text-spotify-muted">
                <svg class="animate-spin h-10 w-10 text-spotify-accent mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <p>Loading tracks...</p>
            </div>

            <!-- Results View -->
            <div id="resultsState" class="mt-4 hidden">
                <h2 class="text-2xl font-bold mb-4" id="resultsTitle">Trending Music</h2>
                <div class="flex flex-col gap-2 md:grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 md:gap-4" id="songsList">
                    <!-- Cards injected via JS -->
                </div>
            </div>

        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden glass fixed bottom-0 left-0 w-full h-[70px] z-20 flex items-center justify-around pb-safe px-2">
        <a href="#" class="flex flex-col items-center gap-1 text-spotify-muted hover:text-white p-2" onclick="fetchTrending()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 3l10 9h-3v9H5v-9H2z"/></svg>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-white p-2" onclick="document.getElementById('searchInput').focus()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.42 1.42-4.39-4.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
            <span class="text-[10px] font-medium">Search</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-spotify-muted hover:text-white p-2" onclick="showFavorites()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span class="text-[10px] font-medium">Favorites</span>
        </a>
    </nav>

    <!-- Mini Player -->
    <div id="miniPlayer" class="glass fixed bottom-[70px] md:bottom-0 left-0 w-full h-16 z-30 flex items-center justify-between px-4 cursor-pointer hidden md:w-[calc(100%-16rem)] md:left-64 slide-down transition-transform duration-300">
        <div class="absolute top-0 left-0 w-full h-[2px] bg-white/10">
            <div id="miniProgress" class="h-full bg-white w-0 transition-all duration-100"></div>
        </div>

        <div class="flex items-center gap-3 w-2/3 md:w-1/2 min-w-0" onclick="openFullScreenPlayer()">
            <img id="miniArt" src="" class="w-10 h-10 rounded shadow object-cover bg-spotify-elevated">
            <div class="flex flex-col overflow-hidden w-full">
                <span id="miniTitle" class="text-white text-sm font-semibold truncate"></span>
                <span id="miniArtist" class="text-spotify-muted text-xs truncate"></span>
            </div>
        </div>
        
        <div class="flex items-center justify-end gap-2 w-1/3 md:w-1/2">
            <button class="text-white w-10 h-10 flex items-center justify-center hover:scale-110 active:scale-95" onclick="togglePlay(event)" id="miniPlayBtn">
                <svg id="miniPlayIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="miniPauseIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <svg id="miniBufferingIcon" class="animate-spin hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="32" stroke-linecap="round"></circle></svg>
            </button>
            <button class="text-white w-10 h-10 flex items-center justify-center hover:scale-110 active:scale-95 hidden sm:flex" onclick="playNext(event)">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <!-- Full Screen "Now Playing" -->
    <div id="fullPlayer" class="fixed inset-0 z-50 bg-spotify-bg flex flex-col slide-down transition-transform duration-500 pt-safe pb-safe h-[100dvh]">
        
        <!-- Blurred Background -->
        <div class="absolute inset-0 z-[-1] overflow-hidden opacity-40">
            <img id="fullBgArt" src="" class="w-full h-full object-cover blur-3xl scale-125">
            <div class="absolute inset-0 bg-black/50"></div>
        </div>

        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4">
            <button class="w-10 h-10 flex items-center justify-center text-white/70 hover:text-white" onclick="closeFullScreenPlayer()">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </button>
            <span class="text-xs font-bold text-white/70 tracking-widest uppercase">Now Playing</span>
            <button class="w-10 h-10 flex items-center justify-center text-white/70 hover:text-white" onclick="openQueue()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M4 10h12v2H4zm0-4h16v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
            </button>
        </div>

        <!-- Album Art -->
        <div class="flex-1 flex items-center justify-center px-8 min-h-0 py-4">
            <img id="fullArt" src="" class="w-full max-w-[340px] aspect-square rounded-2xl shadow-2xl object-cover transition-transform duration-500">
        </div>

        <!-- Controls Area -->
        <div class="flex flex-col px-8 pb-8 mt-auto md:max-w-[600px] md:mx-auto md:w-full">
            
            <div class="flex items-center justify-between mb-6">
                <div class="flex flex-col min-w-0 pr-4">
                    <h2 id="fullTitle" class="text-2xl font-bold text-white truncate"></h2>
                    <h3 id="fullArtist" class="text-lg text-white/70 truncate mt-1"></h3>
                </div>
                <button class="text-white hover:scale-110 transition" onclick="toggleFavorite()">
                    <svg id="heartIcon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="flex flex-col mb-6 group">
                <div class="relative w-full h-6 flex items-center">
                    <input type="range" min="0" max="100" value="0" step="0.1" class="absolute w-full h-full z-10 opacity-0 cursor-pointer touch-none" id="progressBar">
                    <div class="progress-track"><div class="progress-fill" id="progressFillMain"></div></div>
                </div>
                <div class="flex justify-between text-xs font-medium text-white/50 mt-1 font-mono">
                    <span id="currentTimeDisplay">0:00</span>
                    <span id="durationDisplay">0:00</span>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="flex items-center justify-between mb-4">
                <!-- Shuffle -->
                <button class="text-white/50 hover:text-white p-2 transition" id="shuffleBtn" onclick="toggleShuffle()">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
                </button>
                
                <button class="text-white p-2 hover:scale-110 active:scale-95 transition" onclick="playPrevious()">
                    <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <button class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-black shadow-lg hover:scale-105 active:scale-95 transition relative" onclick="togglePlay(event)">
                    <svg id="fullPlayIcon" viewBox="0 0 24 24" width="36" height="36" fill="currentColor" class="ml-1"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="fullPauseIcon" viewBox="0 0 24 24" width="36" height="36" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <svg id="fullBufferingIcon" class="animate-spin hidden absolute" width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="32" stroke-linecap="round"></circle></svg>
                </button>
                
                <button class="text-white p-2 hover:scale-110 active:scale-95 transition" onclick="playNext()">
                    <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                
                <!-- Loop SVG (3-state) -->
                <button class="text-white/50 hover:text-white p-2 transition relative" id="loopBtn" onclick="toggleLoop()">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    <span id="loopOneBadge" class="hidden absolute top-1 right-1 bg-spotify-accent text-black text-[8px] font-bold rounded-full w-3 h-3 flex items-center justify-center">1</span>
                </button>
            </div>
            
            <!-- Bottom Actions -->
            <div class="flex justify-between items-center mt-2 px-2">
                <!-- AirPlay / Bluetooth routing -->
                <button class="text-white/70 hover:text-white transition" onclick="promptAudioRouting()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/></svg>
                </button>
                <button class="text-white/70 hover:text-white transition" onclick="showToast('Share feature coming soon')">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Queue Drawer -->
    <div id="queueDrawer" class="fixed inset-x-0 bottom-0 z-[60] bg-spotify-elevated rounded-t-3xl slide-down transition-transform duration-300 h-[60dvh] flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <div class="flex items-center justify-between p-4 border-b border-white/10">
            <h3 class="text-lg font-bold">Up Next</h3>
            <button class="text-white/50 hover:text-white" onclick="closeQueue()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-2" id="queueList"></div>
    </div>

    <!-- Custom Toast Container -->
    <div id="toast-container" class="fixed top-safe mt-4 left-1/2 transform -translate-x-1/2 z-[100] bg-spotify-elevated border border-white/10 shadow-2xl rounded-full px-6 py-3 text-sm font-medium text-white flex items-center gap-2 opacity-0 pointer-events-none -translate-y-4">
        <span id="toast-message">Notification</span>
    </div>

    <!-- Scripts -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- State Management ---
        const API_KEY = 'AIzaSyA1NzhaIxHuCo_M-YYjK6c5Y0FhCj-2QMs'; // Hardcoded API Key
        let player;
        let isPlayerReady = false;
        let currentQueue = [];
        let currentIndex = -1;
        let isPlaying = false;
        let isBuffering = false;
        let isScrubbing = false;
        let isShuffle = false;
        let loopState = 0; // 0: off, 1: all, 2: one
        let syncInterval;
        let favorites = JSON.parse(localStorage.getItem('ytFavorites')) || [];

        // --- DOM Elements ---
        const miniPlayer = document.getElementById('miniPlayer');
        const fullPlayer = document.getElementById('fullPlayer');
        const loadingState = document.getElementById('loadingState');
        const resultsState = document.getElementById('resultsState');
        const songsList = document.getElementById('songsList');
        const progressBar = document.getElementById('progressBar');
        
        // --- YouTube API Init ---
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                height: '1', width: '1',
                playerVars: { 
                    'autoplay': 1, 'controls': 0, 'disablekb': 1, 'fs': 0, 
                    'modestbranding': 1, 'playsinline': 1, 'rel': 0, 'iv_load_policy': 3 
                },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange, 'onError': onPlayerError }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            fetchTrending(); // Immediately load music when ready
        }
        
        function onPlayerError(e) {
            showToast("Video unavailable or blocked. Skipping to next.");
            playNext();
        }

        // --- Data Fetching ---
        async function fetchTrending() {
            showLoading(true);
            try {
                const q = encodeURIComponent("latest trending bollywood indian songs official music video");
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&videoCategoryId=10&maxResults=20&key=${API_KEY}`);
                const data = await res.json();
                
                if(data.error) throw new Error(data.error.message);
                
                const tracks = data.items.map(item => ({
                    id: item.id.videoId,
                    title: decodeHTMLEntities(item.snippet.title),
                    artist: item.snippet.channelTitle.replace(' - Topic', ''),
                    art: item.snippet.thumbnails.high.url
                }));
                
                renderSongs(tracks, 'Trending Indian Music');
            } catch (err) {
                console.error(err);
                showToast("Failed to fetch trending music.");
            }
            showLoading(false);
        }

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if(!q) return;
            document.getElementById('searchInput').blur();
            
            showLoading(true);
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q + ' official audio')}&type=video&videoCategoryId=10&maxResults=25&key=${API_KEY}`);
                const data = await res.json();
                
                if(data.error) throw new Error(data.error.message);

                const tracks = data.items.map(item => ({
                    id: item.id.videoId,
                    title: decodeHTMLEntities(item.snippet.title),
                    artist: item.snippet.channelTitle,
                    art: item.snippet.thumbnails.high.url
                }));
                
                renderSongs(tracks, `Results for "${q}"`);
            } catch (err) {
                console.error(err);
                showToast("Search failed.");
            }
            showLoading(false);
        });

        function renderSongs(tracks, title) {
            document.getElementById('resultsTitle').textContent = title;
            songsList.innerHTML = '';
            if(tracks.length === 0) songsList.innerHTML = '<p class="text-white/50">No tracks found.</p>';
            
            tracks.forEach((track, idx) => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-2 rounded-xl hover:bg-white/10 transition cursor-pointer group";
                div.onclick = () => {
                    currentQueue = tracks;
                    loadTrack(idx);
                };
                
                div.innerHTML = `
                    <div class="relative w-14 h-14 shrink-0">
                        <img src="${track.art}" class="w-full h-full rounded object-cover shadow">
                        <div class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center rounded">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                    <div class="flex flex-col min-w-0 flex-1">
                        <span class="text-white font-semibold text-sm truncate">${track.title}</span>
                        <span class="text-spotify-muted text-xs truncate">${track.artist}</span>
                    </div>
                `;
                songsList.appendChild(div);
            });
            resultsState.classList.remove('hidden');
        }

        // --- Playback & State Changes ---
        function loadTrack(index) {
            if(!isPlayerReady || index < 0 || index >= currentQueue.length) return;
            currentIndex = index;
            const track = currentQueue[currentIndex];
            
            // Update UI Data
            document.getElementById('miniTitle').textContent = track.title;
            document.getElementById('miniArtist').textContent = track.artist;
            document.getElementById('miniArt').src = track.art;
            
            document.getElementById('fullTitle').textContent = track.title;
            document.getElementById('fullArtist').textContent = track.artist;
            document.getElementById('fullArt').src = track.art;
            document.getElementById('fullBgArt').src = track.art;
            
            updateHeartUI();
            
            // Initial Reset of Progress Bar
            progressBar.value = 0;
            document.getElementById('progressFillMain').style.width = '0%';
            document.getElementById('miniProgress').style.width = '0%';
            document.getElementById('currentTimeDisplay').textContent = "0:00";
            document.getElementById('durationDisplay').textContent = "0:00";
            
            // Show Mini Player
            miniPlayer.classList.remove('hidden', 'slide-down');
            miniPlayer.classList.add('slide-up');

            // Play via YT
            player.loadVideoById(track.id);
            isPlaying = false;
            isBuffering = true;
            updatePlayPauseUI();
            
            // Sync Media Session (Lock screen)
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    artwork: [{ src: track.art, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('previoustrack', playPrevious);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                isBuffering = false;
                updatePlayPauseUI();
                startSync();
                document.getElementById('fullArt').style.transform = 'scale(1)';
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                isBuffering = false;
                updatePlayPauseUI();
                stopSync();
                document.getElementById('fullArt').style.transform = 'scale(0.95)';
            } else if (event.data === YT.PlayerState.BUFFERING) {
                isBuffering = true;
                updatePlayPauseUI();
            } else if (event.data === YT.PlayerState.ENDED) {
                if(loopState === 2) {
                    player.seekTo(0);
                    player.playVideo();
                } else {
                    playNext();
                }
            }
        }

        function togglePlay(e) {
            if(e) e.stopPropagation();
            if(!isPlayerReady) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function playNext(e) {
            if(e) e.stopPropagation();
            if(currentQueue.length === 0) return;
            let nextIdx = currentIndex + 1;
            if(isShuffle) nextIdx = Math.floor(Math.random() * currentQueue.length);
            else if(nextIdx >= currentQueue.length) nextIdx = (loopState === 1) ? 0 : currentIndex;
            
            if(nextIdx !== currentIndex) loadTrack(nextIdx);
            else if(loopState === 0) {
                player.stopVideo();
                isPlaying = false;
                updatePlayPauseUI();
            }
        }

        function playPrevious() {
            if(currentQueue.length === 0) return;
            if(player.getCurrentTime() > 3) {
                player.seekTo(0);
                return;
            }
            let prevIdx = currentIndex - 1;
            if(prevIdx < 0) prevIdx = currentQueue.length - 1;
            loadTrack(prevIdx);
        }

        // --- Controls ---
        function toggleLoop() {
            loopState = (loopState + 1) % 3;
            const btn = document.getElementById('loopBtn');
            const badge = document.getElementById('loopOneBadge');
            
            if(loopState === 0) {
                btn.classList.replace('text-spotify-accent', 'text-white/50');
                badge.classList.add('hidden');
            } else if (loopState === 1) {
                btn.classList.replace('text-white/50', 'text-spotify-accent');
                badge.classList.add('hidden');
            } else {
                badge.classList.remove('hidden');
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffleBtn');
            if(isShuffle) btn.classList.replace('text-white/50', 'text-spotify-accent');
            else btn.classList.replace('text-spotify-accent', 'text-white/50');
        }

        // --- Sync Progress ---
        function startSync() {
            clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if(!player || !player.getCurrentTime || isScrubbing) return;
                
                if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                    const curr = player.getCurrentTime();
                    const dur = player.getDuration();
                    
                    if(dur > 0) {
                        const pct = (curr / dur) * 100;
                        progressBar.value = pct;
                        document.getElementById('progressFillMain').style.width = pct + '%';
                        document.getElementById('miniProgress').style.width = pct + '%';
                        
                        document.getElementById('currentTimeDisplay').textContent = formatTime(curr);
                        document.getElementById('durationDisplay').textContent = formatTime(dur);
                    }
                }
            }, 250); 
        }
        function stopSync() { clearInterval(syncInterval); }

        progressBar.addEventListener('mousedown', () => { isScrubbing = true; });
        progressBar.addEventListener('touchstart', () => { isScrubbing = true; }, {passive: true});
        
        progressBar.addEventListener('input', (e) => {
            document.getElementById('progressFillMain').style.width = e.target.value + '%';
            if(player && player.getDuration) {
                document.getElementById('currentTimeDisplay').textContent = formatTime((e.target.value / 100) * player.getDuration());
            }
        });
        
        const finishScrub = (e) => {
            if(!isScrubbing) return;
            isScrubbing = false;
            if(player && player.getDuration) {
                player.seekTo((e.target.value / 100) * player.getDuration(), true);
            }
        };
        progressBar.addEventListener('mouseup', finishScrub);
        progressBar.addEventListener('touchend', finishScrub);

        // --- Bluetooth / Audio Routing ---
        async function promptAudioRouting() {
            if ('setSinkId' in HTMLMediaElement.prototype && navigator.mediaDevices && navigator.mediaDevices.selectAudioOutput) {
                try {
                    const audioDevice = await navigator.mediaDevices.selectAudioOutput();
                    showToast(`Routing to: ${audioDevice.label}`);
                } catch (err) {
                    console.log(err);
                }
            } else {
                showToast("Use Control Center for AirPlay / Bluetooth on iOS.");
            }
        }

        // --- Favorites ---
        function toggleFavorite() {
            if(currentIndex < 0) return;
            const track = currentQueue[currentIndex];
            const existsIdx = favorites.findIndex(t => t.id === track.id);
            
            if(existsIdx > -1) {
                favorites.splice(existsIdx, 1);
                showToast("Removed from Favorites");
            } else {
                favorites.push(track);
                showToast("Added to Favorites");
            }
            
            localStorage.setItem('ytFavorites', JSON.stringify(favorites));
            updateHeartUI();
        }

        function updateHeartUI() {
            if(currentIndex < 0) return;
            const track = currentQueue[currentIndex];
            const isFav = favorites.some(t => t.id === track.id);
            const icon = document.getElementById('heartIcon');
            
            if(isFav) {
                icon.setAttribute('fill', '#1DB954');
                icon.setAttribute('stroke', '#1DB954');
            } else {
                icon.setAttribute('fill', 'none');
                icon.setAttribute('stroke', 'currentColor');
            }
        }

        function showFavorites() {
            if(favorites.length === 0) {
                showToast("No favorites yet. Tap the heart to add some!");
                return;
            }
            renderSongs(favorites, 'Your Favorites');
        }

        // --- UI Updaters ---
        function updatePlayPauseUI() {
            const arr = [
                { play: document.getElementById('miniPlayIcon'), pause: document.getElementById('miniPauseIcon'), buff: document.getElementById('miniBufferingIcon') },
                { play: document.getElementById('fullPlayIcon'), pause: document.getElementById('fullPauseIcon'), buff: document.getElementById('fullBufferingIcon') }
            ];

            arr.forEach(ui => {
                if (isBuffering) {
                    ui.play.classList.add('hidden');
                    ui.pause.classList.add('hidden');
                    ui.buff.classList.remove('hidden');
                } else if (isPlaying) {
                    ui.play.classList.add('hidden');
                    ui.pause.classList.remove('hidden');
                    ui.buff.classList.add('hidden');
                } else {
                    ui.play.classList.remove('hidden');
                    ui.pause.classList.add('hidden');
                    ui.buff.classList.add('hidden');
                }
            });
        }

        function openFullScreenPlayer() {
            fullPlayer.classList.remove('slide-down');
            fullPlayer.classList.add('slide-up');
        }
        function closeFullScreenPlayer() {
            fullPlayer.classList.remove('slide-up');
            fullPlayer.classList.add('slide-down');
        }

        function openQueue() {
            document.getElementById('queueDrawer').classList.remove('slide-down');
            const list = document.getElementById('queueList');
            list.innerHTML = '';
            currentQueue.forEach((track, i) => {
                const active = i === currentIndex;
                list.innerHTML += `
                    <div class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 cursor-pointer ${active ? 'bg-white/5' : ''}" onclick="loadTrack(${i}); closeQueue()">
                        <img src="${track.art}" class="w-12 h-12 rounded object-cover">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold truncate ${active ? 'text-spotify-accent' : 'text-white'}">${track.title}</p>
                            <p class="text-xs text-spotify-muted truncate">${track.artist}</p>
                        </div>
                    </div>
                `;
            });
        }
        function closeQueue() {
            document.getElementById('queueDrawer').classList.add('slide-down');
        }

        // --- Utils ---
        function formatTime(s) {
            if(isNaN(s)) return "0:00";
            const m = Math.floor(s/60);
            const sec = Math.floor(s%60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }
        function decodeHTMLEntities(text) {
            const t = document.createElement("textarea");
            t.innerHTML = text;
            return t.value;
        }
        function showLoading(show) {
            if(show) {
                loadingState.classList.remove('hidden');
                resultsState.classList.add('hidden');
            } else {
                loadingState.classList.add('hidden');
            }
        }

        // --- Toast System ---
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast-container');
            document.getElementById('toast-message').textContent = message;
            
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 3000);
        }
    </script>
</body>
</html>

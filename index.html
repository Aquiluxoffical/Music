<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Streamify Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] }, 
                    colors: { 
                        apple: { bg: '#000000', surface: '#1C1C1E', elevated: '#2C2C2E', text: '#F5F5F7', accent: '#FA243C' } 
                    },
                    animation: {
                        'liquid-slow': 'liquid 15s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        liquid: {
                            '0%': { transform: 'scale(1.2) rotate(0deg) translate(0, 0)' },
                            '50%': { transform: 'scale(1.4) rotate(5deg) translate(2%, 2%)' },
                            '100%': { transform: 'scale(1.2) rotate(-5deg) translate(-2%, -2%)' }
                        }
                    }
                } 
            } 
        }
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -ms-overflow-style: none; scrollbar-width: none; }
        input[type="text"] { -webkit-user-select: auto; user-select: auto; }
        body { background-color: #000000; color: #F5F5F7; overscroll-behavior-y: none; height: 100dvh; width: 100vw; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }
        
        /* Dynamic Safe Areas */
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        .pb-nav-safe { padding-bottom: max(7.5rem, calc(6.5rem + env(safe-area-inset-bottom))); }
        
        /* Apple Liquid Glassmorphism */
        .glass { 
            background: rgba(40, 40, 40, 0.45); 
            backdrop-filter: blur(40px) saturate(200%); 
            -webkit-backdrop-filter: blur(40px) saturate(200%); 
            border-top: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .glass-pill {
            background: rgba(30, 30, 30, 0.65);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Apple Music Progress Bar */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 24px; display: flex; align-items: center; }
        input[type=range]:focus { outline: none; }
        .progress-track { background: rgba(255,255,255,0.2); height: 4px; border-radius: 2px; width: 100%; position: relative; transition: height 0.2s ease; }
        .progress-fill { background: #ffffff; height: 100%; width: 0%; border-radius: 2px; position: absolute; top: 0; left: 0; pointer-events: none; transition: width 0.1s linear; }
        input[type=range]:active + .progress-track, .group:hover .progress-track { height: 8px; border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 0; width: 0; }
        
        /* Transitions */
        .slide-up { transform: translateY(0%); }
        .slide-down { transform: translateY(100%); opacity: 0; pointer-events: none; }
        .fade-in { opacity: 1; pointer-events: auto; }
        .fade-out { opacity: 0; pointer-events: none; }

        /* Liquid Mesh Background */
        .mesh-bg {
            position: absolute; inset: -20%; width: 140%; height: 140%;
            background-size: cover; background-position: center;
            filter: blur(80px) saturate(200%) brightness(0.65);
            z-index: -1;
            transition: background-image 0.8s ease-in-out;
        }
        .mesh-overlay {
            position: absolute; inset: 0; z-index: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.65) 80%, #000000 100%);
        }
    </style>
</head>
<body class="flex flex-col md:flex-row select-none antialiased">

    <!-- Silent Audio Carrier -->
    <audio id="bgAudioCarrier" loop playsinline preload="auto">
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <!-- Hidden Canvas for Album Art Dominant Color Extraction -->
    <canvas id="colorCanvas" width="32" height="32" class="hidden"></canvas>

    <!-- Hidden YouTube Player Container -->
    <div style="position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; overflow: hidden; z-index: -9999;">
        <div id="ytplayer"></div>
    </div>

    <!-- Desktop Sidebar (macOS Music App Style) -->
    <aside class="hidden md:flex flex-col w-72 bg-[#191919]/80 backdrop-blur-3xl h-full z-10 p-5 border-r border-white/5">
        <div class="text-xl font-bold text-white mb-10 px-2 mt-4 flex items-center gap-3">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#FA243C"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zM12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            Streamify
        </div>
        <nav class="flex flex-col gap-1.5">
            <div class="text-[11px] font-bold text-white/40 uppercase tracking-wider px-2 mb-2">Apple Music</div>
            <a href="#" class="flex items-center gap-3 text-white/70 font-medium px-3 py-2.5 rounded-lg hover:bg-white/10 hover:text-white transition" onclick="document.getElementById('searchInput').focus()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.42 1.42-4.39-4.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg> Search
            </a>
            <a href="#" class="flex items-center gap-3 text-white font-medium px-3 py-2.5 rounded-lg bg-white/15 transition shadow-sm" onclick="fetchTrending()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="#FA243C"><path d="M12 3l10 9h-3v9H5v-9H2z"/></svg> Listen Now
            </a>
            <div class="text-[11px] font-bold text-white/40 uppercase tracking-wider px-2 mt-6 mb-2">Library</div>
            <a href="#" class="flex items-center gap-3 text-white/70 font-medium px-3 py-2.5 rounded-lg hover:bg-white/10 hover:text-white transition" onclick="showFavorites()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> Songs
            </a>
        </nav>

        <!-- SponsorBlock Toggle Status -->
        <div class="mt-auto pt-4 border-t border-white/10 px-2">
            <button id="sbToggleBtn" onclick="toggleSponsorBlock()" class="w-full flex items-center justify-between text-xs text-white/70 hover:text-white py-2 px-3 rounded-lg bg-white/5 transition">
                <span class="flex items-center gap-2">
                    <span id="sbDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    SponsorBlock Skip
                </span>
                <span id="sbStatusText" class="font-semibold text-emerald-400">ON</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-apple-bg relative z-0">
        <header class="pt-safe md:p-6 sticky top-0 bg-apple-bg/80 backdrop-blur-2xl z-10 flex justify-center items-center border-b border-white/5 pb-3 md:pb-6 px-4 gap-3">
            <form id="searchForm" class="relative w-full max-w-xl mt-2 md:mt-0">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white/40"><path d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.42 1.42-4.39-4.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
                <input type="text" id="searchInput" placeholder="Artists, Songs, Lyrics and More" class="w-full bg-[#1C1C1E] text-white rounded-xl py-2.5 pl-11 pr-4 font-medium focus:outline-none focus:bg-[#2C2C2E] transition-colors placeholder:text-white/40 border border-white/5 shadow-inner">
            </form>
            <!-- Mobile SponsorBlock Quick Pill -->
            <button onclick="toggleSponsorBlock()" class="md:hidden mt-2 px-3 py-2.5 rounded-xl bg-[#1C1C1E] border border-white/5 text-xs font-semibold flex items-center gap-1.5 shrink-0" title="Toggle SponsorBlock">
                <span id="sbDotMobile" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>SB</span>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto px-4 md:px-8 pb-nav-safe" id="mainScrollArea">
            <div id="loadingState" class="hidden flex-col items-center justify-center py-40 text-white/40">
                <svg class="animate-spin h-10 w-10 text-[#FA243C] mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </div>
            <div id="resultsState" class="mt-6 hidden">
                <h2 class="text-3xl font-bold mb-6 tracking-tight text-white border-b border-white/10 pb-3" id="resultsTitle">Listen Now</h2>
                <div class="flex flex-col gap-1 md:grid md:grid-cols-2 xl:grid-cols-3 md:gap-x-6 md:gap-y-3" id="songsList"></div>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation (iOS Style) -->
    <nav class="md:hidden glass fixed bottom-0 left-0 w-full h-[85px] z-20 flex items-start justify-around pb-safe px-4 pt-2">
        <a href="#" class="flex flex-col items-center gap-1 text-[#FA243C] p-2" onclick="fetchTrending()">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 3l10 9h-3v9H5v-9H2z"/></svg>
            <span class="text-[10px] font-semibold">Listen Now</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-white/50 hover:text-white/80 p-2 transition" onclick="document.getElementById('searchInput').focus()">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.42 1.42-4.39-4.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
            <span class="text-[10px] font-semibold">Search</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 text-white/50 hover:text-white/80 p-2 transition" onclick="showFavorites()">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span class="text-[10px] font-semibold">Library</span>
        </a>
    </nav>

    <!-- Floating Mini Player (iOS 17 Pill Style) -->
    <div id="miniPlayer" class="glass-pill fixed bottom-[95px] md:bottom-6 left-3 right-3 md:left-auto md:right-8 md:w-[380px] h-[64px] z-30 flex items-center justify-between px-3 cursor-pointer hidden rounded-2xl fade-out transition-all duration-300 transform scale-95" onclick="openFullScreenPlayer()">
        <div class="flex items-center gap-3 w-[60%] min-w-0">
            <img id="miniArt" src="" class="w-12 h-12 rounded-lg shadow-md object-cover bg-white/10">
            <div class="flex flex-col overflow-hidden w-full">
                <span id="miniTitle" class="text-white text-sm font-semibold truncate"></span>
                <span id="miniArtist" class="text-white/50 text-xs truncate"></span>
            </div>
        </div>
        <div class="flex items-center justify-end gap-1 w-[40%]">
            <button class="text-white w-10 h-10 flex items-center justify-center hover:scale-110 active:opacity-50 transition" onclick="togglePlay(event)" id="miniPlayBtn">
                <svg id="miniPlayIcon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="miniPauseIcon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <svg id="miniBufferingIcon" class="animate-spin hidden" width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="32" stroke-linecap="round"></circle></svg>
            </button>
            <button class="text-white w-10 h-10 flex items-center justify-center hover:scale-110 active:opacity-50 transition hidden sm:flex" onclick="playNext(event)">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
        <div class="absolute bottom-0 left-0 w-full h-[2px] bg-white/5 rounded-b-2xl overflow-hidden">
            <div id="miniProgress" class="h-full bg-white/60 w-0 transition-all duration-100"></div>
        </div>
    </div>

    <!-- Full Screen Liquid Glass Player -->
    <div id="fullPlayer" class="fixed inset-0 z-50 bg-black flex flex-col slide-down transition-transform duration-500 h-[100dvh]">
        <!-- Liquid Mesh Background -->
        <div class="absolute inset-0 overflow-hidden">
            <div id="fullBgArt" class="mesh-bg animate-liquid-slow"></div>
            <div class="mesh-overlay"></div>
        </div>

        <div class="flex flex-shrink-0 items-center justify-between px-6 pt-safe h-20 relative z-10">
            <button class="w-10 h-10 flex items-center justify-center text-white/60 hover:text-white transition" onclick="closeFullScreenPlayer()">
                <div class="w-10 h-[5px] bg-white/30 rounded-full mb-8 absolute top-3 left-1/2 transform -translate-x-1/2"></div>
                <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </button>
            
            <!-- Visualizer Mode Toggle Pill -->
            <button id="visToggleBtn" onclick="toggleVisualizer()" class="px-3.5 py-1.5 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/15 text-[11px] font-semibold tracking-wider uppercase text-white/80 transition flex items-center gap-1.5">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 3v18M8 8v8M16 6v12M4 11v2M20 9v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                <span id="visLabel">Visualizer: On</span>
            </button>

            <button class="w-10 h-10 flex items-center justify-center text-white/60 hover:text-white transition" onclick="openQueue()">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 10h12v2H4zm0-4h16v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
            </button>
        </div>

        <!-- Center Stage: Album Art + Reactive Audio Visualizer Canvas -->
        <div class="flex-1 flex items-center justify-center px-8 md:px-12 py-4 relative z-10">
            <!-- Reactive Audio Visualizer Canvas -->
            <canvas id="audioVisualizer" class="absolute inset-0 w-full h-full pointer-events-none z-0 transition-opacity duration-500"></canvas>
            
            <img id="fullArt" crossorigin="anonymous" src="" class="relative z-10 w-full h-full max-w-[340px] max-h-[340px] md:max-w-[380px] md:max-h-[380px] object-cover rounded-[2rem] shadow-[0_30px_60px_rgba(0,0,0,0.65)] transition-all duration-500 aspect-square border border-white/10">
            
            <div id="adBadge" class="absolute top-6 bg-black/70 text-white border border-white/15 px-5 py-2.5 rounded-full font-semibold text-sm hidden items-center gap-3 backdrop-blur-xl shadow-2xl z-20">
                <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Bypassing Ad...
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="flex-shrink-0 flex flex-col px-8 pb-safe pt-2 md:max-w-[600px] md:mx-auto md:w-full relative z-10">
            <div class="flex items-end justify-between mb-6">
                <div class="flex flex-col min-w-0 pr-4">
                    <h2 id="fullTitle" class="text-2xl font-bold text-white truncate drop-shadow-md"></h2>
                    <h3 id="fullArtist" class="text-lg text-white/60 truncate mt-0.5"></h3>
                </div>
                <button class="text-white/80 hover:text-white hover:scale-110 transition active:scale-90 flex-shrink-0 mb-1" onclick="toggleFavorite()">
                    <svg id="heartIcon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
            </div>

            <!-- Scrubber with SponsorBlock Segment Markers -->
            <div class="flex flex-col mb-7 group">
                <div class="relative w-full h-6 flex items-center">
                    <input type="range" min="0" max="100" value="0" step="0.1" class="absolute w-full h-full z-20 opacity-0 cursor-pointer touch-none" id="progressBar">
                    <div class="progress-track overflow-hidden">
                        <div id="sbMarkersContainer" class="absolute inset-0 pointer-events-none z-10"></div>
                        <div class="progress-fill z-20" id="progressFillMain"></div>
                    </div>
                </div>
                <div class="flex justify-between text-xs font-semibold text-white/50 mt-2">
                    <span id="currentTimeDisplay">0:00</span>
                    <span id="durationDisplay">0:00</span>
                </div>
            </div>

            <div class="flex items-center justify-between mb-6 px-2">
                <button class="text-white/50 hover:text-white p-2 transition active:opacity-50" id="shuffleBtn" onclick="toggleShuffle()">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
                </button>
                <button class="text-white p-2 hover:scale-110 active:opacity-50 transition" onclick="playPrevious()">
                    <svg viewBox="0 0 24 24" width="42" height="42" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white/30 active:scale-95 transition-all relative border border-white/10" onclick="togglePlay(event)">
                    <svg id="fullPlayIcon" viewBox="0 0 24 24" width="38" height="38" fill="currentColor" class="ml-1"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="fullPauseIcon" viewBox="0 0 24 24" width="38" height="38" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <svg id="fullBufferingIcon" class="animate-spin hidden absolute" width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="32" stroke-linecap="round"></circle></svg>
                </button>
                <button class="text-white p-2 hover:scale-110 active:opacity-50 transition" onclick="playNext()">
                    <svg viewBox="0 0 24 24" width="42" height="42" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="text-white/50 hover:text-white p-2 transition relative active:opacity-50" id="loopBtn" onclick="toggleLoop()">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    <span id="loopOneBadge" class="hidden absolute top-1 right-1 bg-white text-black text-[9px] font-bold rounded-full w-[14px] h-[14px] flex items-center justify-center">1</span>
                </button>
            </div>
            
            <div class="flex justify-between items-center mt-2 px-6 pb-4">
                <button class="text-white/50 hover:text-white transition active:scale-95" onclick="promptAudioRouting()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/></svg>
                </button>
                <button class="text-white/50 hover:text-white transition active:scale-95" onclick="showToast('AirPlay & Cast integration')">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><polygon points="12 15 17 21 7 21 12 15"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Apple Music Style Queue Drawer -->
    <div id="queueDrawer" class="fixed inset-x-0 bottom-0 z-[60] bg-[#1C1C1E]/95 backdrop-blur-2xl rounded-t-[2rem] slide-down transition-transform duration-400 h-[70dvh] flex flex-col shadow-[0_-20px_50px_rgba(0,0,0,0.5)] border-t border-white/10 pb-safe">
        <div class="flex items-center justify-between p-6 border-b border-white/5 relative">
            <div class="w-12 h-[5px] bg-white/20 rounded-full absolute top-3 left-1/2 transform -translate-x-1/2"></div>
            <h3 class="text-xl font-bold mt-2">Playing Next</h3>
            <button class="text-white/40 hover:text-white bg-white/5 rounded-full p-1.5 mt-2" onclick="closeQueue()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>

    </div>

    <!-- Notification Toast -->
    <div id="toast-container" class="fixed top-safe mt-6 left-1/2 transform -translate-x-1/2 z-[100] bg-[#2C2C2E]/90 backdrop-blur-2xl border border-white/10 shadow-2xl rounded-full px-6 py-3 text-sm font-semibold text-white flex items-center gap-2 opacity-0 pointer-events-none -translate-y-4 transition-all duration-300">
        <span id="toast-message">Notification</span>
    </div>

    <!-- Scripts -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const API_KEY = 'AIzaSyA1NzhaIxHuCo_M-YYjK6c5Y0FhCj-2QMs';
        let player;
        let isPlayerReady = false;
        let currentQueue = [];
        let currentIndex = -1;
        let isPlaying = false;
        let isBuffering = false;
        let isScrubbing = false;
        let isShuffle = false;
        let loopState = 0;
        let syncInterval;
        let favorites = JSON.parse(localStorage.getItem('ytFavorites')) || [];

        // SponsorBlock State
        let sponsorBlockEnabled = true;
        let activeSkipSegments = [];
        let skippedSegmentUUIDs = new Set();

        // Visualizer & Color State
        let visualizerEnabled = true;
        let dominantColor = { r: 250, g: 36, b: 60 }; // Default Apple Music Red
        let visAnimFrame;
        let visPhase = 0;
        
        const bgCarrier = document.getElementById('bgAudioCarrier');

        document.body.addEventListener('touchstart', forceAudioUnlock, { once: false, passive: true });
        document.body.addEventListener('click', forceAudioUnlock, { once: false, passive: true });

        function forceAudioUnlock() {
            if (bgCarrier && bgCarrier.paused) {
                bgCarrier.volume = 0.01;
                bgCarrier.play().catch(() => {});
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                height: '100%', width: '100%',
                playerVars: { 
                    'autoplay': 1, 'controls': 0, 'disablekb': 1, 'fs': 0, 
                    'modestbranding': 1, 'playsinline': 1, 'rel': 0, 'iv_load_policy': 3 
                },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange, 'onError': onPlayerError }
            });
        }

        function onPlayerReady() {
            isPlayerReady = true;
            fetchTrending();
            initVisualizerLoop();
        }
        
        function onPlayerError() {
            showToast("Track unavailable. Skipping...");
            playNext();
        }

        // ==========================================
        // 1. SPONSORBLOCK API INTEGRATION
        // ==========================================
        function toggleSponsorBlock() {
            sponsorBlockEnabled = !sponsorBlockEnabled;
            const statusText = document.getElementById('sbStatusText');
            const dot = document.getElementById('sbDot');
            const dotMob = document.getElementById('sbDotMobile');

            if (sponsorBlockEnabled) {
                statusText.textContent = 'ON';
                statusText.className = 'font-semibold text-emerald-400';
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                dotMob.className = 'w-2 h-2 rounded-full bg-emerald-400';
                showToast("SponsorBlock: Skipping non-music segments");
            } else {
                statusText.textContent = 'OFF';
                statusText.className = 'font-semibold text-white/40';
                dot.className = 'w-2 h-2 rounded-full bg-white/30';
                dotMob.className = 'w-2 h-2 rounded-full bg-white/30';
                showToast("SponsorBlock: Disabled");
            }
            renderSponsorMarkers();
        }

        async function fetchSponsorSegments(videoId) {
            activeSkipSegments = [];
            skippedSegmentUUIDs.clear();
            document.getElementById('sbMarkersContainer').innerHTML = '';
            if (!videoId) return;

            try {
                const categories = encodeURIComponent(JSON.stringify(["music_offtopic", "sponsor", "intro", "outro"]));
                const res = await fetch(`https://sponsor.ajay.app/api/skipSegments?videoID=${videoId}&categories=${categories}`);
                if (res.status === 200) {
                    const data = await res.json();
                    activeSkipSegments = data.map(item => ({
                        uuid: item.UUID,
                        start: item.segment[0],
                        end: item.segment[1],
                        category: item.category
                    }));
                    renderSponsorMarkers();
                }
            } catch (e) {
                // 404 is normal when a video has no SponsorBlock submissions
            }
        }

        function renderSponsorMarkers() {
            const container = document.getElementById('sbMarkersContainer');
            container.innerHTML = '';
            if (!sponsorBlockEnabled || !player || !player.getDuration) return;
            const dur = player.getDuration();
            if (!dur || dur <= 0) return;

            activeSkipSegments.forEach(seg => {
                const leftPct = (seg.start / dur) * 100;
                const widthPct = ((seg.end - seg.start) / dur) * 100;
                const marker = document.createElement('div');
                marker.style.left = `${leftPct}%`;
                marker.style.width = `${Math.max(widthPct, 1)}%`;
                marker.className = 'absolute top-0 bottom-0 bg-emerald-400/70';
                container.appendChild(marker);
            });
        }

        // ==========================================
        // 2. WEB AUDIO / REACTIVE LIQUID VISUALIZER
        // ==========================================
        function extractDominantColor(imgElement) {
            try {
                const canvas = document.getElementById('colorCanvas');
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgElement, 0, 0, 32, 32);
                const data = ctx.getImageData(0, 0, 32, 32).data;
                let r = 0, g = 0, b = 0, count = 0;

                for (let i = 0; i < data.length; i += 16) {
                    const pr = data[i], pg = data[i+1], pb = data[i+2];
                    // Skip near-black or near-white pixels for vibrant tint
                    if ((pr + pg + pb) > 60 && (pr + pg + pb) < 680) {
                        r += pr; g += pg; b += pb; count++;
                    }
                }
                if (count > 0) {
                    dominantColor = {
                        r: Math.min(255, Math.round((r / count) * 1.2)),
                        g: Math.min(255, Math.round((g / count) * 1.2)),
                        b: Math.min(255, Math.round((b / count) * 1.2))
                    };
                }
            } catch (e) {
                dominantColor = { r: 250, g: 36, b: 60 };
            }
        }

        function toggleVisualizer() {
            visualizerEnabled = !visualizerEnabled;
            const canvas = document.getElementById('audioVisualizer');
            const label = document.getElementById('visLabel');
            if (visualizerEnabled) {
                canvas.style.opacity = '1';
                label.textContent = 'Visualizer: On';
            } else {
                canvas.style.opacity = '0';
                label.textContent = 'Visualizer: Off';
            }
        }

        function initVisualizerLoop() {
            const canvas = document.getElementById('audioVisualizer');
            const ctx = canvas.getContext('2d');

            function draw() {
                visAnimFrame = requestAnimationFrame(draw);
                if (!visualizerEnabled) return;

                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
                    canvas.width = rect.width * dpr;
                    canvas.height = rect.height * dpr;
                }

                ctx.save();
                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, rect.width, rect.height);

                const cx = rect.width / 2;
                const cy = rect.height / 2;
                const artEl = document.getElementById('fullArt');
                const baseRadius = (artEl ? artEl.offsetWidth / 2 : 150) * 0.96;

                if (isPlaying && !isBuffering) {
                    visPhase += 0.045;
                } else {
                    visPhase += 0.008;
                }

                const energy = (isPlaying && !isBuffering) ? 1 : 0.15;
                const { r, g, b } = dominantColor;

                // Draw 3 concentric harmonic liquid rings + radial spectrum bars
                for (let ring = 0; ring < 3; ring++) {
                    ctx.beginPath();
                    const segments = 72;
                    for (let i = 0; i <= segments; i++) {
                        const angle = (i / segments) * Math.PI * 2;
                        const wave1 = Math.sin(angle * 4 + visPhase + ring) * (8 * energy);
                        const wave2 = Math.cos(angle * 7 - visPhase * 1.4) * (5 * energy);
                        const pulse = Math.sin(visPhase * 2.2) * (6 * energy);
                        const radius = baseRadius + 10 + (ring * 14) + wave1 + wave2 + pulse;

                        const x = cx + Math.cos(angle) * radius;
                        const y = cy + Math.sin(angle) * radius;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${(0.35 - ring * 0.1) * (energy + 0.2)})`;
                    ctx.lineWidth = 2.5 - ring * 0.5;
                    ctx.stroke();
                }

                // Subtle radial equalizer ticks around artwork perimeter
                const bars = 64;
                for (let i = 0; i < bars; i++) {
                    const angle = (i / bars) * Math.PI * 2;
                    const freqSim = Math.abs(Math.sin(i * 0.4 + visPhase * 1.8) * Math.cos(i * 0.25 - visPhase));
                    const barHeight = (4 + freqSim * 26) * energy;
                    const rStart = baseRadius + 6;
                    const rEnd = rStart + barHeight;

                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(angle) * rStart, cy + Math.sin(angle) * rStart);
                    ctx.lineTo(cx + Math.cos(angle) * rEnd, cy + Math.sin(angle) * rEnd);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 + freqSim * 0.35 * energy})`;
                    ctx.lineWidth = 2;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                ctx.restore();
            }
            draw();
        }

        // ==========================================
        // 3. SEARCH, TRENDING & QUEUE LOGIC
        // ==========================================
        async function fetchTrending() {
            showLoading(true);
            try {
                const q = encodeURIComponent("latest trending bollywood indian songs official music video");
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&videoCategoryId=10&maxResults=20&key=${API_KEY}`);
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);
                const tracks = data.items.map(item => ({
                    id: item.id.videoId,
                    title: decodeHTMLEntities(item.snippet.title).split('|')[0].trim(),
                    artist: item.snippet.channelTitle.replace(' - Topic', '').replace('VEVO', ''),
                    art: item.snippet.thumbnails.high.url
                }));
                renderSongs(tracks, 'Listen Now');
            } catch (err) {
                showToast("Failed to fetch trending music.");
            }
            showLoading(false);
        }

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if(!q) return;
            document.getElementById('searchInput').blur();
            showLoading(true);
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q + ' official audio')}&type=video&videoCategoryId=10&maxResults=25&key=${API_KEY}`);
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);
                const tracks = data.items.map(item => ({
                    id: item.id.videoId,
                    title: decodeHTMLEntities(item.snippet.title).split('|')[0].trim(),
                    artist: item.snippet.channelTitle,
                    art: item.snippet.thumbnails.high.url
                }));
                renderSongs(tracks, `Results for "${q}"`);
            } catch (err) {
                showToast("Search failed.");
            }
            showLoading(false);
        });

        function renderSongs(tracks, title) {
            document.getElementById('resultsTitle').textContent = title;
            const songsList = document.getElementById('songsList');
            songsList.innerHTML = '';
            if(tracks.length === 0) songsList.innerHTML = '<p class="text-white/50 px-2">No tracks found.</p>';
            
            tracks.forEach((track, idx) => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-4 py-2 px-3 rounded-xl hover:bg-white/5 transition-colors cursor-pointer group";
                div.onclick = () => {
                    forceAudioUnlock();
                    currentQueue = tracks;
                    loadTrack(idx);
                };
                div.innerHTML = `
                    <div class="relative w-12 h-12 shrink-0 md:w-14 md:h-14">
                        <img src="${track.art}" class="w-full h-full rounded-md object-cover shadow-sm">
                        <div class="absolute inset-0 bg-black/30 hidden group-hover:flex items-center justify-center rounded-md">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                    <div class="flex flex-col min-w-0 flex-1 pr-2 border-b border-white/5 pb-2 md:border-none md:pb-0">
                        <span class="text-white font-medium text-[15px] truncate">${track.title}</span>
                        <span class="text-white/50 text-[13px] truncate mt-0.5 group-hover:text-white/80 transition-colors">${track.artist}</span>
                    </div>
                `;
                songsList.appendChild(div);
            });
            document.getElementById('resultsState').classList.remove('hidden');
        }

        function loadTrack(index) {
            if(!isPlayerReady || index < 0 || index >= currentQueue.length) return;
            currentIndex = index;
            const track = currentQueue[currentIndex];
            
            document.getElementById('miniTitle').textContent = track.title;
            document.getElementById('miniArtist').textContent = track.artist;
            document.getElementById('miniArt').src = track.art;
            
            const fullArtEl = document.getElementById('fullArt');
            fullArtEl.onload = () => extractDominantColor(fullArtEl);
            fullArtEl.src = track.art;

            document.getElementById('fullTitle').textContent = track.title;
            document.getElementById('fullArtist').textContent = track.artist;
            document.getElementById('fullBgArt').style.backgroundImage = `url('${track.art}')`;
            updateHeartUI();
            
            const progressBar = document.getElementById('progressBar');
            progressBar.value = 0;
            document.getElementById('progressFillMain').style.width = '0%';
            document.getElementById('miniProgress').style.width = '0%';
            document.getElementById('currentTimeDisplay').textContent = "0:00";
            document.getElementById('durationDisplay').textContent = "0:00";
            
            const miniPlayer = document.getElementById('miniPlayer');
            miniPlayer.classList.remove('hidden', 'fade-out', 'scale-95');
            miniPlayer.classList.add('fade-in', 'scale-100');

            forceAudioUnlock();
            player.loadVideoById(track.id);
            isPlaying = false;
            isBuffering = true;
            updatePlayPauseUI();
            
            setupMediaSession(track);
            fetchSponsorSegments(track.id);
        }

        function setupMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    artwork: [{ src: track.art, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', () => { forceAudioUnlock(); if(player.playVideo) player.playVideo(); });
                navigator.mediaSession.setActionHandler('pause', () => { if(bgCarrier) bgCarrier.pause(); if(player.pauseVideo) player.pauseVideo(); });
                navigator.mediaSession.setActionHandler('previoustrack', playPrevious);
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isPlaying && player && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                player.playVideo();
            }
        });

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true; isBuffering = false;
                forceAudioUnlock(); updatePlayPauseUI(); startSync();
                renderSponsorMarkers();
                document.getElementById('fullArt').style.transform = 'scale(1)';
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false; isBuffering = false;
                updatePlayPauseUI(); stopSync();
                document.getElementById('fullArt').style.transform = 'scale(0.88)';
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
            } else if (event.data === YT.PlayerState.BUFFERING) {
                isBuffering = true; updatePlayPauseUI();
            } else if (event.data === YT.PlayerState.ENDED) {
                if(loopState === 2) { player.seekTo(0); player.playVideo(); } else { playNext(); }
            }
        }

        function togglePlay(e) {
            if(e) e.stopPropagation();
            if(!isPlayerReady) return;
            forceAudioUnlock();
            player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
        }

        function playNext(e) {
            if(e) e.stopPropagation();
            if(currentQueue.length === 0) return;
            let nextIdx = currentIndex + 1;
            if(isShuffle) nextIdx = Math.floor(Math.random() * currentQueue.length);
            else if(nextIdx >= currentQueue.length) nextIdx = (loopState === 1) ? 0 : currentIndex;
            
            if(nextIdx !== currentIndex) loadTrack(nextIdx);
            else if(loopState === 0) { player.stopVideo(); isPlaying = false; updatePlayPauseUI(); }
        }

        function playPrevious() {
            if(currentQueue.length === 0) return;
            if(player.getCurrentTime() > 3) { player.seekTo(0); return; }
            let prevIdx = currentIndex - 1;
            if(prevIdx < 0) prevIdx = currentQueue.length - 1;
            loadTrack(prevIdx);
        }

        function toggleLoop() {
            loopState = (loopState + 1) % 3;
            const btn = document.getElementById('loopBtn');
            const badge = document.getElementById('loopOneBadge');
            if(loopState === 0) { btn.classList.replace('text-white', 'text-white/50'); badge.classList.add('hidden'); } 
            else if (loopState === 1) { btn.classList.replace('text-white/50', 'text-white'); badge.classList.add('hidden'); } 
            else { badge.classList.remove('hidden'); }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffleBtn');
            isShuffle ? btn.classList.replace('text-white/50', 'text-white') : btn.classList.replace('text-white', 'text-white/50');
        }

        function startSync() {
            clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if(!player || !player.getCurrentTime || isScrubbing) return;
                if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                    const url = player.getVideoUrl() || "";
                    const trackId = currentQueue[currentIndex]?.id || "";
                    const isAd = url && trackId && !url.includes(trackId);
                    const adBadge = document.getElementById('adBadge');
                    
                    // 1. Pre-roll Ad Bypass
                    if (isAd) {
                        if (!adBadge.classList.contains('flex')) { player.mute(); adBadge.classList.remove('hidden'); adBadge.classList.add('flex'); }
                        if (player.getDuration() > 0) player.seekTo(player.getDuration() - 0.5, true);
                        return; 
                    } else {
                        if (adBadge.classList.contains('flex')) { player.unMute(); adBadge.classList.add('hidden'); adBadge.classList.remove('flex'); }
                    }

                    const curr = player.getCurrentTime();
                    const dur = player.getDuration();

                    // 2. SponsorBlock Non-Music / Intro / Outro Skip
                    if (sponsorBlockEnabled && activeSkipSegments.length > 0) {
                        for (const seg of activeSkipSegments) {
                            if (curr >= seg.start && curr < (seg.end - 0.5) && !skippedSegmentUUIDs.has(seg.uuid)) {
                                skippedSegmentUUIDs.add(seg.uuid);
                                player.seekTo(seg.end, true);
                                const label = seg.category === 'music_offtopic' ? 'Non-Music Section' : seg.category;
                                showToast(`Skipped ${label}`);
                                return;
                            }
                        }
                    }

                    const progressBar = document.getElementById('progressBar');
                    if(dur > 0) {
                        const pct = (curr / dur) * 100;
                        progressBar.value = pct;
                        document.getElementById('progressFillMain').style.width = pct + '%';
                        document.getElementById('miniProgress').style.width = pct + '%';
                        document.getElementById('currentTimeDisplay').textContent = formatTime(curr);
                        document.getElementById('durationDisplay').textContent = formatTime(dur);

                        if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
                            navigator.mediaSession.setPositionState({ duration: dur, playbackRate: 1, position: curr });
                        }
                    }
                }
            }, 400); 
        }
        function stopSync() { clearInterval(syncInterval); }

        const progressBar = document.getElementById('progressBar');
        progressBar.addEventListener('mousedown', () => { isScrubbing = true; });
        progressBar.addEventListener('touchstart', () => { isScrubbing = true; }, {passive: true});
        progressBar.addEventListener('input', (e) => {
            document.getElementById('progressFillMain').style.width = e.target.value + '%';
            if(player && player.getDuration) document.getElementById('currentTimeDisplay').textContent = formatTime((e.target.value / 100) * player.getDuration());
        });
        const finishScrub = (e) => {
            if(!isScrubbing) return;
            isScrubbing = false;
            if(player && player.getDuration) player.seekTo((e.target.value / 100) * player.getDuration(), true);
        };
        progressBar.addEventListener('mouseup', finishScrub);
        progressBar.addEventListener('touchend', finishScrub);

        async function promptAudioRouting() {
            if ('setSinkId' in HTMLMediaElement.prototype && navigator.mediaDevices && navigator.mediaDevices.selectAudioOutput) {
                try { const audioDevice = await navigator.mediaDevices.selectAudioOutput(); showToast(`Routing to: ${audioDevice.label}`); } catch (err) {}
            } else { showToast("Use Control Center for AirPlay / Bluetooth."); }
        }

        function toggleFavorite() {
            if(currentIndex < 0) return;
            const track = currentQueue[currentIndex];
            const existsIdx = favorites.findIndex(t => t.id === track.id);
            if(existsIdx > -1) { favorites.splice(existsIdx, 1); showToast("Removed from Library"); } 
            else { favorites.push(track); showToast("Added to Library"); }
            localStorage.setItem('ytFavorites', JSON.stringify(favorites));
            updateHeartUI();
        }

        function updateHeartUI() {
            if(currentIndex < 0) return;
            const track = currentQueue[currentIndex];
            const isFav = favorites.some(t => t.id === track.id);
            const icon = document.getElementById('heartIcon');
            isFav ? icon.setAttribute('fill', '#FA243C') : icon.setAttribute('fill', 'none');
            isFav ? icon.setAttribute('stroke', '#FA243C') : icon.setAttribute('stroke', 'currentColor');
        }

        function showFavorites() {
            if(favorites.length === 0) { showToast("Your Library is empty."); return; }
            renderSongs(favorites, 'Library');
        }

        function updatePlayPauseUI() {
            const arr = [
                { play: document.getElementById('miniPlayIcon'), pause: document.getElementById('miniPauseIcon'), buff: document.getElementById('miniBufferingIcon') },
                { play: document.getElementById('fullPlayIcon'), pause: document.getElementById('fullPauseIcon'), buff: document.getElementById('fullBufferingIcon') }
            ];
            arr.forEach(ui => {
                if (isBuffering) { ui.play.classList.add('hidden'); ui.pause.classList.add('hidden'); ui.buff.classList.remove('hidden'); } 
                else if (isPlaying) { ui.play.classList.add('hidden'); ui.pause.classList.remove('hidden'); ui.buff.classList.add('hidden'); } 
                else { ui.play.classList.remove('hidden'); ui.pause.classList.add('hidden'); ui.buff.classList.add('hidden'); }
            });
        }

        function openFullScreenPlayer() { const fullPlayer = document.getElementById('fullPlayer'); fullPlayer.classList.remove('slide-down'); fullPlayer.classList.add('slide-up'); }
        function closeFullScreenPlayer() { const fullPlayer = document.getElementById('fullPlayer'); fullPlayer.classList.remove('slide-up'); fullPlayer.classList.add('slide-down'); }
        function openQueue() {
            document.getElementById('queueDrawer').classList.remove('slide-down');
            const list = document.getElementById('queueList');
            list.innerHTML = '';
            currentQueue.forEach((track, i) => {
                const active = i === currentIndex;
                list.innerHTML += `
                    <div class="flex items-center gap-4 p-3 mx-2 my-1 rounded-xl cursor-pointer transition-colors ${active ? 'bg-white/10' : 'hover:bg-white/5'}" onclick="loadTrack(${i}); closeQueue()">
                        <img src="${track.art}" class="w-12 h-12 rounded-md object-cover shadow-sm">
                        <div class="flex-1 min-w-0"><p class="text-[15px] font-semibold truncate ${active ? 'text-white' : 'text-white/80'}">${track.title}</p><p class="text-xs text-white/50 truncate">${track.artist}</p></div>
                        ${active ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="#FA243C"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>' : ''}
                    </div>`;
            });
        }
        function closeQueue() { document.getElementById('queueDrawer').classList.add('slide-down'); }
        function formatTime(s) { if(isNaN(s)) return "0:00"; const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
        function decodeHTMLEntities(text) { const t = document.createElement("textarea"); t.innerHTML = text; return t.value; }
        function showLoading(show) {
            const loadingState = document.getElementById('loadingState');
            const resultsState = document.getElementById('resultsState');
            if(show) { loadingState.classList.remove('hidden'); loadingState.classList.add('flex'); resultsState.classList.add('hidden'); } else { loadingState.classList.add('hidden'); loadingState.classList.remove('flex'); }
        }
        
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast-container');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('opacity-0', '-translate-y-4'); toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('opacity-100', 'translate-y-0'); toast.classList.add('opacity-0', '-translate-y-4'); }, 3000);
        }
    </script>
</body>
</html>
